<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Registro de Vida Escolar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: misma familia que Convivencia Escolar — barra institucional con pestañas; "Hoy" como tablero de turno del inspector; registro rápido pensado para el celular en la puerta. */
:root{
  --bg:#e6f0fa; --surface:#ffffff; --surface-2:#edf3fa; --ink:#16203a; --muted:#52607a; --line:#cddbeb;
  --accent:#0f3f7a; --accent-ink:#ffffff; --accent-soft:#e1e7f3; --bar2:#9fb1d6;
  --head-bg:#0f3f7a; --head-ink:#ffffff; --head-muted:#b9c9e6; --head-line:#2a5692; --head-tab:#ff6b7d; --brand-red:#e4152f;
  --danger:#b3261e; --danger-soft:#fbe3e0; --warn:#8f5a00; --warn-soft:#fbeed2; --ok:#2c6a3d; --ok-soft:#dff0e3;
  --scrim:rgba(10,15,20,.45);
  --t-atr:#1d5fbf; --t-atr-soft:#e1ebfa; --t-an:#9a5500; --t-an-soft:#fcecd4; --t-dis:#b4233c; --t-dis-soft:#fbe1e5; --t-med:#2a7442; --t-med-soft:#ddf1e3; --t-cit:#6a3fb5; --t-cit-soft:#ece4f9; --t-pos:#0b7a7e; --t-pos-soft:#d9f1f1; --t-ret:#4d5b70; --t-ret-soft:#e5e9ef; --t-ina:#a3367a; --t-ina-soft:#f7e1ef;
  --shadow:0 10px 40px rgba(20,30,40,.18);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1422; --surface:#161d2e; --surface-2:#1f2839; --ink:#e4e9f4; --muted:#98a3ba; --line:#2a3448;
  --accent:#8fb0f0; --accent-ink:#0b1630; --accent-soft:#1b2944; --bar2:#34507f;
  --head-bg:#0b1733; --head-ink:#eef2fb; --head-muted:#98a8cc; --head-line:#1f2e52; --head-tab:#ff8a98; --brand-red:#e4152f;
  --danger:#f08c84; --danger-soft:#3b1d1a; --warn:#e9b658; --warn-soft:#382b12; --ok:#81cd96; --ok-soft:#16301f;
  --t-atr:#8db8f5; --t-atr-soft:#1a2b47; --t-an:#f0b860; --t-an-soft:#3a2a10; --t-dis:#f28da0; --t-dis-soft:#3d1a23; --t-med:#86d29c; --t-med-soft:#16321f; --t-cit:#c4a6f5; --t-cit-soft:#2b2143; --t-pos:#6fd6d9; --t-pos-soft:#11343a; --t-ret:#b9c4d4; --t-ret-soft:#262e3a; --t-ina:#f0a3d0; --t-ina-soft:#3a1830;
  --scrim:rgba(0,0,0,.6); --shadow:0 10px 40px rgba(0,0,0,.5); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0f1422; --surface:#161d2e; --surface-2:#1f2839; --ink:#e4e9f4; --muted:#98a3ba; --line:#2a3448;
  --accent:#8fb0f0; --accent-ink:#0b1630; --accent-soft:#1b2944; --bar2:#34507f;
  --head-bg:#0b1733; --head-ink:#eef2fb; --head-muted:#98a8cc; --head-line:#1f2e52; --head-tab:#ff8a98; --brand-red:#e4152f;
  --danger:#f08c84; --danger-soft:#3b1d1a; --warn:#e9b658; --warn-soft:#382b12; --ok:#81cd96; --ok-soft:#16301f;
  --t-atr:#8db8f5; --t-atr-soft:#1a2b47; --t-an:#f0b860; --t-an-soft:#3a2a10; --t-dis:#f28da0; --t-dis-soft:#3d1a23; --t-med:#86d29c; --t-med-soft:#16321f; --t-cit:#c4a6f5; --t-cit-soft:#2b2143; --t-pos:#6fd6d9; --t-pos-soft:#11343a; --t-ret:#b9c4d4; --t-ret-soft:#262e3a; --t-ina:#f0a3d0; --t-ina-soft:#3a1830;
  --scrim:rgba(0,0,0,.6); --shadow:0 10px 40px rgba(0,0,0,.5); color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head-bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-size:.86em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ref{font-size:12px;color:var(--muted)}

/* Header */
header.top{background:var(--head-bg);color:var(--head-ink);border-bottom:3px solid var(--brand-red);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo-plate{background:#fff;border-radius:10px;padding:5px 10px;display:flex;align-items:center;flex:none}
.logo-plate img{height:40px;width:auto;display:block}
@media (max-width:520px){.logo-plate img{height:30px}}
.brand-sep{width:1px;align-self:stretch;background:var(--head-line)}
.brand h1{font-size:19px}
.brand p{margin:0;font-size:13px;color:var(--head-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mode{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--head-line);color:var(--head-muted)}
.theme-btn{display:inline-flex;align-items:center;gap:6px}
.theme-btn svg{width:15px;height:15px;flex:none}
@media (max-width:600px){.theme-btn span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.theme-btn{padding:5px 9px}}
.autor-btn{border:1px solid var(--head-line);background:transparent;color:var(--head-ink);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.autor-btn .al{font-weight:400;color:var(--head-muted)}
.autor-btn.empty{background:var(--brand-red);border-color:var(--brand-red)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;padding:10px 14px 12px;border-bottom:2.5px solid transparent;color:var(--head-muted);font-weight:600;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--head-ink);border-bottom-color:var(--head-tab)}
nav.tabs button:hover{color:var(--head-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.tabs button:focus-visible,.autor-btn:focus-visible{outline-color:var(--head-tab)}
.tabs .count{font-size:11px;background:#e5484d;color:#fff;border-radius:999px;padding:1px 7px;margin-left:4px;vertical-align:1px}

main{padding-block:22px 70px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin-bottom:18px;font-size:14px}
.banner.warnb{background:var(--warn-soft)}

/* Buttons & fields */
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:9px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.on-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn.on-bad{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.btn.on-warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;min-width:0}
label.f .hint{font-weight:400;color:var(--muted);font-size:12px}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],input[type=email],input[type=password],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-weight:400;min-height:42px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.check{display:flex;gap:9px;align-items:flex-start;font-size:14px;font-weight:500;cursor:pointer}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:720px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.g2,.g3{grid-template-columns:1fr}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.row > .f{flex:1 1 150px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.panel + .panel{margin-top:16px}
.panel h2{font-size:20px;margin-bottom:4px}
.panel .lead{margin:0 0 16px;color:var(--muted);font-size:14px}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin:26px 0 10px}
.section-h:first-child{margin-top:0}
.section-h h2{font-size:19px}
.section-h .n{font-family:var(--f-mono);font-size:13px;color:var(--muted)}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.leve{background:var(--accent-soft);color:var(--accent)}
.chip.grave,.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.extrema,.chip.bad{background:var(--danger-soft);color:var(--danger)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.tchip{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.t-atraso{--tc:var(--t-atr);--ts:var(--t-atr-soft)} .t-positiva{--tc:var(--t-pos);--ts:var(--t-pos-soft)} .t-anotacion{--tc:var(--t-an);--ts:var(--t-an-soft)} .t-dispositivo{--tc:var(--t-dis);--ts:var(--t-dis-soft)} .t-medida{--tc:var(--t-med);--ts:var(--t-med-soft)} .t-citacion{--tc:var(--t-cit);--ts:var(--t-cit-soft)} .t-retiro{--tc:var(--t-ret);--ts:var(--t-ret-soft)} .t-inasistencia{--tc:var(--t-ina);--ts:var(--t-ina-soft)}
.tchip{background:var(--ts,var(--surface-2));color:var(--tc,var(--muted))}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.hoy-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,390px);gap:20px;align-items:start}
.hoy-main{min-width:0}
@media (max-width:920px){.hoy-grid{grid-template-columns:1fr}.pend{order:-1}}
.pend{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pend-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 2px 4px}
.pend-h h2{font-size:18px}
.pi{border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 15px;box-shadow:inset 4px 0 0 var(--bar2);display:flex;flex-direction:column;gap:4px;font-size:14px}
.pi.grave{box-shadow:inset 4px 0 0 var(--danger)} .pi.aviso{box-shadow:inset 4px 0 0 var(--warn)}
.pi-n .linkname{font-weight:700}
.pi-s{line-height:1.4}
.pi-a{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:6px}
.tile{background:var(--ts);color:var(--tc);border-radius:12px;padding:12px 15px}
.tile .v{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.1}
.tile .l{font-size:13px;font-weight:600}
.evs{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.ev{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:10px 15px 10px 19px;border-top:1px solid var(--line);box-shadow:inset 5px 0 0 var(--tc,var(--line))}
.ev:first-child{border-top:0}
.ev .hr{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.ev .sub{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.ev .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
@media (max-width:640px){.ev{grid-template-columns:46px minmax(0,1fr)}.ev .acts{grid-column:2;justify-content:flex-start}}
.li{box-shadow:inset 4px 0 0 var(--tc,transparent)}
.cal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.cal-head h2{font-size:21px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0}
.day{background:var(--surface);border:1px solid var(--line);border-radius:9px;min-height:86px;padding:6px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-width:0}
.day:hover{border-color:var(--muted)}
.day.off{background:transparent;border:0;cursor:default}
.day.we{background:var(--surface-2)}
.day.past .dn{color:var(--muted)}
.day.today .dn{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 7px}
.day[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.dn{font-weight:700;font-size:13px;align-self:flex-start;font-variant-numeric:tabular-nums}
.cdots{display:flex;flex-wrap:wrap;gap:3px}
.cdot{font-size:11px;font-weight:700;padding:0 6px;border-radius:999px;background:var(--ts);color:var(--tc);font-variant-numeric:tabular-nums;line-height:17px}
@media (max-width:600px){.day{min-height:56px;padding:4px}.cdot{font-size:0;width:8px;height:8px;padding:0;background:var(--tc)}}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:6px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;text-align:left;min-width:0}
button.kpi{cursor:pointer} button.kpi:hover{border-color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12.5px;color:var(--muted);margin-top:3px}
.kpi.danger .v{color:var(--danger)} .kpi.warn .v{color:var(--warn)}

/* Alert cards */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px 15px 13px 19px;position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center}
.alert::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--bar2)}
.alert.grave::before{background:var(--danger)} .alert.aviso::before{background:var(--warn)}
.alert .who{font-weight:700}
.alert .t{font-weight:600;font-size:14.5px}
.alert .d{font-size:13.5px;color:var(--muted);margin:2px 0 0}
.alert .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:720px){.alert{grid-template-columns:1fr}.alert .acts{justify-content:flex-start}}
.linkname{background:none;border:0;padding:0;font-weight:700;color:var(--ink);cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.linkname:hover{text-decoration-color:var(--accent)}

/* Session roll call */
.sess{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sess + .sess{margin-top:10px}
.sess-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 15px;background:var(--surface-2);font-weight:600}
.sess-h .when{font-family:var(--f-display);font-size:16px}
.sess-h.late{background:var(--danger-soft);color:var(--danger)}
.roll{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:10px 15px;border-top:1px solid var(--line)}
.roll .sub{display:block;font-size:12.5px;color:var(--muted)}
.roll .acts{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:600px){.roll{grid-template-columns:1fr}}

/* Lists */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.li{display:grid;grid-template-columns:96px 108px minmax(0,1.3fr) minmax(0,1.6fr) minmax(0,.9fr);gap:12px;align-items:center;padding:11px 15px;border:0;border-top:1px solid var(--line);background:var(--surface);text-align:left;width:100%;font-size:14px;cursor:pointer}
.li:first-child{border-top:0}
.li:hover{background:var(--accent-soft)}
.li .sub{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li > span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.li-head{cursor:default;background:var(--surface-2);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.li-head:hover{background:var(--surface-2)}
@media (max-width:820px){.li{grid-template-columns:auto minmax(0,1fr);gap:4px 12px}.li-head{display:none}.li .c-det,.li .c-por{grid-column:1 / -1}.li .c-est{grid-column:2;grid-row:1}.li .c-fecha{grid-row:2;grid-column:1}.li .c-tipo{grid-row:2;grid-column:2;justify-self:start}}
.est-li{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,.8fr) repeat(3,78px) minmax(0,1fr);gap:12px;align-items:center;padding:11px 15px;border:0;border-top:1px solid var(--line);background:var(--surface);text-align:left;width:100%;font-size:14px;cursor:pointer}
.est-li:first-child{border-top:0}
.est-li:hover{background:var(--accent-soft)}
.est-li.li-head{cursor:default;background:var(--surface-2)}
.cursos{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.cgrp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cgrp b{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:58px;flex:none}
.cchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.cchip:hover{border-color:var(--accent)}
.cchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.curso-h{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin:0 0 6px}
.curso-h h2{font-size:21px}

function lsGet(k,f){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):f; }catch(e){ return f; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function applyConfig(o){ const d=CFG_DEF(); state.config=Object.assign(d,o||{}); state.config.inspectores=Object.assign(d.inspectores,(o&&o.inspectores)||{}); if(!Array.isArray(state.config.feriados)) state.config.feriados=FERIADOS_DEF.slice(); FERIADOS=new Set(state.config.feriados); }
const regCol = () => "anios/"+state.year+"/registros";
let FS=null, CLAVE=null, unsubs=[];
const remote = () => state.mode==="db" || state.mode==="fb";
const PFX = () => state.mode==="fb" ? "espacios/"+CLAVE+"/" : "";
const dref = path => (state.mode==="fb"?FS:DB).doc(PFX()+path);
const cref = path => (state.mode==="fb"?FS:DB).collection(PFX()+path);
function subscribe(){
  unsubs.forEach(u=>{ try{ u(); }catch(e){} }); unsubs=[]; state.gotR=state.gotE=false; state.loaded=false;
  unsubs.push(cref(regCol()).onSnapshot(s=>{ state.registros=s.docs.map(d=>Object.assign(clone(d.data()),{id:d.id})); state.gotR=true; afterLoad(); }, e=>{ state.gotR=true; if(state.mode==="fb" && e && e.code==="permission-denied") showGate("error","La base de datos rechazó la conexión. Revise que las reglas de Firestore estén publicadas."); else toast("No se pudieron leer los registros. Recargue la página."); afterLoad(); }));
  unsubs.push(cref("estudiantes").onSnapshot(s=>{ state.estudiantes=s.docs.map(d=>Object.assign(clone(d.data()),{id:d.id})); state.gotE=true; afterLoad(); }, ()=>{ state.gotE=true; afterLoad(); }));
  unsubs.push(dref("config/general").onSnapshot(s=>{ if(s.exists) applyConfig(clone(s.data())); state.cfgLoaded=true; syncSesion(); renderAll(); if(state.tab==="ajustes" && !(state.mode==="fb" && document.activeElement && document.activeElement.closest && document.activeElement.closest("#view-ajustes"))) renderAjustes(); }, ()=>{ state.cfgLoaded=true; syncSesion(); }));
}
async function initStore(){
  if(!IN_CLAUDE && FIREBASE_CONFIG) return initFirebase();
  let db=null;
  try{ if(IN_CLAUDE) db=await window.claude.use("db"); }catch(e){ db=null; }
  if(db){
    DB=db; state.mode="db"; subscribe();
  } else {
    state.mode="local"; state.registros=lsGet(LS_R,[]); state.estudiantes=lsGet(LS_E,[]); applyConfig(lsGet(LS_C,{})); state.gotR=state.gotE=true; afterLoad();
  }
  renderAll();
}
let autoDemoDone=false;
function afterLoad(){
  if(state.gotR && state.gotE && !state.loaded){
    state.loaded=true;
    let off=false; try{ off=localStorage.getItem("ve-demo-off")==="1"; }catch(e){}
    if(!autoDemoDone && !off && state.mode!=="fb" && !state.registros.length && !state.estudiantes.length){ autoDemoDone=true; startDemo(); return; }
  }
  if(state.demo && (state.registros.length || state.estudiantes.length) && state.demoAuto){ state.demo=false; state.demoData=null; toast("Ya hay registros reales: se cerró la demostración."); }
  renderAll();
}
async function saveReg(r){
  const data=clone(r); delete data.id; data.actualizado=new Date().toISOString(); data.actualizadoPor=ME||"";
  if(state.demo){ const a=state.demoData.registros, i=a.findIndex(x=>x.id===r.id); const rec=Object.assign(data,{id:r.id}); if(i>=0) a[i]=rec; else a.push(rec); renderAll(); return true; }
  if(remote()){ try{ await dref(regCol()+"/"+r.id).set(data); return true; }catch(e){ toast(e&&(e.code==="invalid_argument"||e.code==="permission-denied")?"Su acceso es de solo lectura; no puede guardar.":e&&(e.code==="quota_exceeded"||e.code==="resource-exhausted")?"Se superó la cuota de la base de datos.":"No se pudo guardar. Intente de nuevo."); return false; } }
  const i=state.registros.findIndex(x=>x.id===r.id); const rec=Object.assign(data,{id:r.id}); if(i>=0) state.registros[i]=rec; else state.registros.push(rec); lsSet(LS_R,state.registros); renderAll(); return true;
}
async function delReg(id){
  if(state.demo){ state.demoData.registros=state.demoData.registros.filter(r=>r.id!==id); renderAll(); return true; }
  if(remote()){ try{ await dref(regCol()+"/"+id).delete(); return true; }catch(e){ toast("No se pudo eliminar."); return false; } }
  state.registros=state.registros.filter(r=>r.id!==id); lsSet(LS_R,state.registros); renderAll(); return true;
}
async function saveEst(e){
  const data=clone(e); delete data.id; data.actualizado=new Date().toISOString();
  if(state.demo){ const a=state.demoData.estudiantes, i=a.findIndex(x=>x.id===e.id); const rec=Object.assign(data,{id:e.id}); if(i>=0) a[i]=rec; else a.push(rec); renderAll(); return true; }
  if(remote()){ try{ await dref("estudiantes/"+e.id).set(data); return true; }catch(err){ toast("No se pudo guardar el estudiante."); return false; } }
  const i=state.estudiantes.findIndex(x=>x.id===e.id); const rec=Object.assign(data,{id:e.id}); if(i>=0) state.estudiantes[i]=rec; else state.estudiantes.push(rec); lsSet(LS_E,state.estudiantes); renderAll(); return true;
}
async function ackAviso(estId, key, nota){
  const e=EST.get(estId); if(!e) return false;
  const v={fecha:today(), por:ME||"", nota:nota||"", ts:new Date().toISOString()};
  if(remote() && !state.demo){ try{ await dref("estudiantes/"+estId).update(state.mode==="fb"?{["avisos."+key]:v}:{avisos:{[key]:v}}); return true; }catch(err){ toast("No se pudo marcar el aviso."); return false; } }
  const n=clone(e); n.avisos=Object.assign({},n.avisos||{},{[key]:v}); return saveEst(n);
}
async function saveConfig(cfg){
  if(state.demo){ applyConfig(cfg); renderAll(); return true; }
  if(remote()){ try{ await dref("config/general").set(cfg); applyConfig(cfg); return true; }catch(e){ return false; } }
  applyConfig(cfg); lsSet(LS_C,cfg); renderAll(); return true;
}
async function ensureEst(sel){
  if(sel.id && EST.get(sel.id)) return sel.id;
  const k=nkey(sel.nombre); const ex=E().find(e=>nkey(e.nombre)===k && e.nivel===sel.nivel);
  if(ex) return ex.id;
  const id=uid("e"); const ok=await saveEst({id, nombre:sel.nombre.trim(), nivel:sel.nivel, letra:sel.letra||"", avisos:{}, creado:today(), creadoPor:ME||""});
  if(!ok) return null; if(state.demo||state.mode==="local") rebuild(); else EST.set(id,{id,nombre:sel.nombre.trim(),nivel:sel.nivel,letra:sel.letra||"",avisos:{}});
  return id;
}
function baseReg(tipo, estId){ const e=EST.get(estId)||{}; return {id:uid("r"), tipo, estId, nombre:e.nombre||"", nivel:e.nivel||"", letra:e.letra||"", por:ME||"", ts:new Date().toISOString()}; }

/* =================== Versión GitHub Pages: igual que Convivencia (enlace del equipo + perfiles con PIN) =================== */
function loadScript(src){ return new Promise((res,rej)=>{ const sc=document.createElement("script"); sc.src=src; sc.onload=res; sc.onerror=()=>rej(new Error(src)); document.head.appendChild(sc); }); }
function nuevaClave(){ const a=new Uint8Array(24); crypto.getRandomValues(a); return Array.from(a,x=>"abcdefghijkmnpqrstuvwxyz23456789"[x%32]).join(""); }
const enlaceEquipo = () => location.origin+location.pathname+"#k="+CLAVE;
function leerClave(){
  const m=/[#&]k=([a-z0-9]{24,64})/i.exec(location.hash||"");
  if(m){ CLAVE=m[1]; lsSet("ve-clave",CLAVE); try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){} return; }
  if(!CLAVE) CLAVE=lsGet("ve-clave",null);
}
async function initFirebase(){
  state.mode="fb"; renderHeader();
  leerClave();
  if(!CLAVE){ showGate("sinEnlace"); return; }
  const base="https://www.gstatic.com/firebasejs/10.12.2/";
  try{ await loadScript(base+"firebase-app-compat.js"); await loadScript(base+"firebase-firestore-compat.js"); }
  catch(e){ showGate("error","No se pudo conectar con la base de datos. Revise su conexión a internet y recargue la página."); return; }
  try{ firebase.initializeApp(FIREBASE_CONFIG); FS=firebase.firestore(); FS.settings({ignoreUndefinedProperties:true}); }
  catch(e){ showGate("error","La configuración de Firebase no es válida. Revise el bloque FIREBASE_CONFIG al inicio del código."); return; }
  $("#gate").hidden=true;
  subscribe();
}
function showGate(kind, extra){
  const g=$("#gate"); g.hidden=false;
  const logo=(document.querySelector(".logo-plate img")||{}).src||"";
  let body="";
  if(kind==="sinEnlace"){
    body='<p>Vida Escolar se abre con el <strong>enlace del equipo</strong>. Pídalo a quien administra la plataforma y ábralo en este dispositivo.</p>'+
      '<form id="gLink" class="grid"><label class="f">¿Ya tiene el enlace? Péguelo aquí<input type="text" id="gLinkIn" autocomplete="off" placeholder="https://…#k=…"></label><button class="btn primary" type="submit">Entrar</button></form>'+
      '<details class="gate-first"><summary>Primera vez: crear el espacio del colegio</summary><p class="muted">Solo quien instala la plataforma lo hace, una sola vez. Se genera el enlace del equipo para compartir con los inspectores.</p><button class="btn" id="gNew" type="button">Crear espacio y generar enlace</button></details>'+
      '<p class="gate-err" id="gErr" role="alert"></p>';
  } else if(kind==="nuevo"){
    body='<p><strong>Espacio creado.</strong> Este es el enlace del equipo. Guárdelo y compártalo solo con Inspectoría y Vida Escolar: quien lo tenga puede entrar.</p>'+
      '<div class="linkbox"><code id="gNewLink">'+esc(enlaceEquipo())+'</code><button class="btn sm" id="gCopy" type="button">Copiar</button></div>'+
      '<p class="muted" style="font-size:13px">También queda en Ajustes → Enlace del equipo.</p><button class="btn primary gate-btn" id="gGo" type="button">Entrar a la plataforma</button>';
  } else body='<p class="gate-err" role="alert">'+esc(extra||"Ocurrió un error.")+'</p><button class="btn gate-btn" type="button" id="gRe">Reintentar</button>';
  g.innerHTML='<div class="gate-card"><img class="gate-logo" src="'+logo+'" alt="Lycée Claude Gay Osorno"><h1>Vida Escolar</h1>'+body+'</div>';
  const gl=$("#gLink"); if(gl) gl.onsubmit=ev=>{ ev.preventDefault(); const m=/[#&]k=([a-z0-9]{24,64})/i.exec($("#gLinkIn").value.trim()); if(!m){ $("#gErr").textContent="Ese no parece el enlace del equipo. Debe terminar en #k= seguido de letras y números."; return; } CLAVE=m[1]; lsSet("ve-clave",CLAVE); initFirebase(); };
  const gn=$("#gNew"); if(gn) gn.onclick=()=>{ CLAVE=nuevaClave(); lsSet("ve-clave",CLAVE); showGate("nuevo"); };
  const gc=$("#gCopy"); if(gc) gc.onclick=()=>copiar(enlaceEquipo(), gc);
  const gg=$("#gGo"); if(gg) gg.onclick=()=>initFirebase();
  const gr=$("#gRe"); if(gr) gr.onclick=()=>location.reload();
}
async function copiar(txt, btn){
  try{ await navigator.clipboard.writeText(txt); const t=btn.textContent; btn.textContent="Copiado"; setTimeout(()=>btn.textContent=t,1500); }
  catch(e){ const el=btn.previousElementSibling; if(el){ const r=document.createRange(); r.selectNodeContents(el); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); } toast("Seleccione el texto y cópielo con Ctrl+C."); }
}

/* ---------- Perfiles con PIN (como Convivencia) ---------- */
const ROLES_PERFIL = { admin:{l:"Administración", d:"Todo: registros, Ajustes, perfiles y eliminar registros."}, inspector:{l:"Inspector/a", d:"Registra y edita atrasos, anotaciones, dispositivos, medidas y citaciones."} };
let PERFIL=null;
const perfilesLista = () => Array.isArray(state.config.perfiles) ? state.config.perfiles : [];
const hayPerfiles = () => state.mode==="fb" && perfilesLista().length>0;
function can(accion){ if(!hayPerfiles() || state.demo) return true; if(!PERFIL) return false; if(accion==="ajustes"||accion==="eliminar") return PERFIL.rol==="admin"; return true; }
async function hashClave(v){ const buf=await crypto.subtle.digest("SHA-256", new TextEncoder().encode("vida-escolar-lcg|"+String(v))); return Array.from(new Uint8Array(buf),x=>x.toString(16).padStart(2,"0")).join(""); }
const hashPin = (id,pin) => hashClave("pin|"+id+"|"+pin);
async function checkClave(v){ const c=state.config; if(c.claveHash){ try{ return (await hashClave(v))===c.claveHash; }catch(e){ return false; } } return String(v)===String(c.claveEliminar||"0000"); }
function pinAzar(){ const a=new Uint32Array(1); crypto.getRandomValues(a); return String(1000+(a[0]%9000)); }
function iniciarPerfil(p, recordar){ PERFIL=p; ME=p.nombre+(p.cargo?", "+p.cargo:""); if(recordar) lsSet("ve-perfil",p.id); aplicarPermisos(); renderAll(); if(state.tab==="ajustes") renderAjustes(); }
function cerrarSesion(){ PERFIL=null; ME=null; try{ localStorage.removeItem("ve-perfil"); }catch(e){} closeDrawer(); aplicarPermisos(); renderHeader(); elegirPerfil(); }
function aplicarPermisos(){ const ta=$("#tab-ajustes"); ta.hidden = hayPerfiles() && !can("ajustes"); if(state.tab==="ajustes" && ta.hidden) setTab("hoy"); }
function syncSesion(){
  if(state.mode!=="fb" || !$("#gate").hidden) return;
  if(hayPerfiles()){
    if(PERFIL && PERFIL.id!=="_clave"){ const p=perfilesLista().find(x=>x.id===PERFIL.id); if(!p){ cerrarSesion(); return; } PERFIL=p; ME=p.nombre+(p.cargo?", "+p.cargo:""); }
    else if(!PERFIL){ const id=lsGet("ve-perfil",null); const p=id && perfilesLista().find(x=>x.id===id); if(p) iniciarPerfil(p,false); else if(!state.pickerOpen) elegirPerfil(); }
  } else if(!ME && !state.nameAsked){ state.nameAsked=true; pedirAutor(); }
  aplicarPermisos();
}
let pinFallos=0, pinBloqueo=0;
function elegirPerfil(){
  state.pickerOpen=true;
  const ps=perfilesLista().slice().sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"));
  const logo=(document.querySelector(".logo-plate img")||{}).src||"";
  const h=$("#pickHost"); h.hidden=false;
  h.innerHTML='<div class="gate-card" role="dialog" aria-modal="true" aria-labelledby="pTitle"><img class="gate-logo" src="'+logo+'" alt="Lycée Claude Gay Osorno"><h1 id="pTitle">¿Quién ingresa?</h1><p id="pStep">Elija su nombre.</p>'+
    '<input type="search" id="pSearch" placeholder="Buscar por nombre" autocomplete="off"'+(ps.length>6?'':' hidden')+'><div class="plist" id="pList" role="list"></div>'+
    '<form id="pForm" class="grid" hidden><p id="pWho" style="font-weight:700;margin:0"></p><label class="f">PIN<input type="password" id="pPin" inputmode="numeric" autocomplete="off" maxlength="8"></label><label class="check"><input type="checkbox" id="pRec" checked> Recordarme en este dispositivo</label><div class="row" style="justify-content:space-between"><button type="button" class="btn" id="pBack">Volver</button><button type="submit" class="btn primary">Entrar</button></div></form>'+
    '<p class="gate-err" id="pErr" role="alert"></p>'+
    '<details class="gate-first"><summary>Acceso de administración con clave</summary><p class="muted">Si olvidó su PIN, entre con la clave de administración y restablézcalo en Ajustes → Perfiles.</p><form id="pKeyForm" class="row"><input type="password" id="pKey" autocomplete="off" style="flex:1 1 140px" placeholder="Clave de administración"><button class="btn" type="submit">Entrar</button></form></details></div>';
  let sel=null; const err=t=>{ $("#pErr").textContent=t||""; };
  const pintar=()=>{ const q=nkey($("#pSearch").value); const arr=ps.filter(p=>!q||nkey(p.nombre+" "+(p.cargo||"")).includes(q));
    $("#pList").innerHTML=arr.map(p=>'<button type="button" class="pitem" role="listitem" data-pid="'+esc(p.id)+'"><strong>'+esc(p.nombre)+'</strong><span>'+esc(p.cargo||(ROLES_PERFIL[p.rol]||{}).l||"")+'</span></button>').join("")||'<p class="muted">Nadie coincide.</p>';
    h.querySelectorAll("[data-pid]").forEach(b=>b.onclick=()=>{ sel=ps.find(p=>p.id===b.dataset.pid); $("#pList").hidden=true; $("#pSearch").hidden=true; $("#pForm").hidden=false; $("#pStep").textContent="Escriba su PIN."; $("#pWho").textContent=sel.nombre; err(""); setTimeout(()=>$("#pPin").focus(),30); }); };
  $("#pSearch").oninput=pintar; pintar();
  $("#pBack").onclick=()=>{ sel=null; $("#pForm").hidden=true; $("#pList").hidden=false; $("#pSearch").hidden=ps.length<=6; $("#pStep").textContent="Elija su nombre."; err(""); };
  $("#pForm").onsubmit=async ev=>{ ev.preventDefault(); if(!sel) return;
    if(Date.now()<pinBloqueo){ err("Demasiados intentos. Espere "+Math.ceil((pinBloqueo-Date.now())/1000)+" segundos."); return; }
    let ok=false; try{ ok=(await hashPin(sel.id,$("#pPin").value.trim()))===sel.pinHash; }catch(e){}
    if(!ok){ pinFallos++; if(pinFallos>=5){ pinBloqueo=Date.now()+30000; pinFallos=0; } err("PIN incorrecto."); $("#pPin").value=""; $("#pPin").focus(); return; }
    pinFallos=0; const rec=$("#pRec").checked; cerrarPicker(); iniciarPerfil(sel,rec); toast("Hola, "+sel.nombre); };
  $("#pKeyForm").onsubmit=async ev=>{ ev.preventDefault(); if(await checkClave($("#pKey").value)){ cerrarPicker(); iniciarPerfil({id:"_clave",nombre:"Administración",cargo:"",rol:"admin"},false); setTab("ajustes"); } else { err("Clave de administración incorrecta."); $("#pKey").value=""; } };
}
function cerrarPicker(){ state.pickerOpen=false; const h=$("#pickHost"); h.hidden=true; h.innerHTML=""; }
async function guardarPerfiles(lista){ const cfg=Object.assign(clone(state.config),{perfiles:lista}); if(!cfg.claveHash){ try{ cfg.claveHash=await hashClave(String(state.config.claveEliminar||"0000")); delete cfg.claveEliminar; }catch(e){} } return saveConfig(cfg); }
function renderPerfiles(){
  const host=$("#perfilesPanel"); if(!host) return;
  host.hidden = state.mode!=="fb"; if(host.hidden) return;
  $("#eqLink").textContent=enlaceEquipo();
  const ps=perfilesLista().slice().sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"));
  $("#pfIntro").textContent = ps.length ? "Cada persona entra eligiendo su nombre y escribiendo su PIN. Lo que registre queda con su nombre." : "Aún no hay perfiles: cualquiera con el enlace entra escribiendo su nombre. Cree primero su propio perfil de Administración.";
  $("#pfList").innerHTML = ps.length ? ps.map(p=>'<li><span><strong>'+esc(p.nombre)+'</strong>'+(p.cargo?' · '+esc(p.cargo):'')+'<span class="sub">'+esc((ROLES_PERFIL[p.rol]||{}).l||p.rol)+(PERFIL&&PERFIL.id===p.id?' · (usted)':'')+'</span></span><span class="row" style="gap:6px"><button class="btn sm" data-pfpin="'+esc(p.id)+'" type="button">Cambiar PIN</button><button class="btn sm ghost" style="color:var(--danger)" data-pfdel="'+esc(p.id)+'" type="button">Quitar</button></span></li>').join("") : '<li class="muted">Sin perfiles todavía.</li>';
  if(!ps.length) $("#pfRol").value="admin";
  $$("[data-pfdel]").forEach(b=>b.onclick=async()=>{ const id=b.dataset.pfdel, lista=perfilesLista().filter(x=>x.id!==id);
    if(lista.length && !lista.some(x=>x.rol==="admin")){ toast("Debe quedar al menos un perfil de Administración."); return; }
    if(b.dataset.confirm!=="1"){ b.dataset.confirm="1"; b.textContent="¿Quitar? Toque de nuevo"; return; }
    if(await guardarPerfiles(lista)){ toast("Perfil quitado"); if(PERFIL&&PERFIL.id===id) cerrarSesion(); else renderPerfiles(); } });
  $$("[data-pfpin]").forEach(b=>b.onclick=()=>{ const id=b.dataset.pfpin, act=b.parentElement;
    act.innerHTML='<input type="password" inputmode="numeric" maxlength="8" placeholder="Nuevo PIN (4 a 8 números)" style="width:190px;min-height:32px;padding:4px 8px" id="pfNewPin"><button class="btn sm primary" type="button" id="pfPinSave">Guardar</button><button class="btn sm" type="button" id="pfPinRand">Al azar</button>';
    const inp=$("#pfNewPin"); inp.focus();
    const guardar=async pin=>{ const lista=perfilesLista().map(x=>x.id===id?Object.assign({},x):x); const p=lista.find(x=>x.id===id); p.pinHash=await hashPin(id,pin);
      if(await guardarPerfiles(lista)){ mostrarPin([{nombre:p.nombre,cargo:p.cargo,pin}]); renderPerfiles(); toast("PIN actualizado"); } else toast("No se pudo guardar el PIN."); };
    $("#pfPinSave").onclick=()=>{ const pin=inp.value.trim(); if(!/^\d{4,8}$/.test(pin)){ toast("El PIN debe tener entre 4 y 8 números."); inp.focus(); return; } guardar(pin); };
    inp.onkeydown=ev=>{ if(ev.key==="Enter"){ ev.preventDefault(); $("#pfPinSave").click(); } };
    $("#pfPinRand").onclick=()=>guardar(pinAzar()); });
  $("#pfAdd").onsubmit=async ev=>{ ev.preventDefault(); const nombre=$("#pfNombre").value.trim(), cargo=$("#pfCargo").value.trim(), rol=$("#pfRol").value;
    if(nombre.length<2){ $("#pfNombre").focus(); return; }
    if(!perfilesLista().length && rol!=="admin"){ toast("El primer perfil debe ser de Administración."); return; }
    const id="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6), pin=pinAzar();
    const lista=perfilesLista().concat([{id,nombre,cargo,rol,pinHash:await hashPin(id,pin),creado:today()}]);
    if(!(await guardarPerfiles(lista))){ toast("No se pudo guardar el perfil."); return; }
    $("#pfNombre").value=""; $("#pfCargo").value="";
    if(lista.length===1) iniciarPerfil(lista[0],true);
    mostrarPin([{nombre,cargo,pin}]); renderPerfiles(); };
  $("#eqCopy").onclick=()=>copiar(enlaceEquipo(), $("#eqCopy"));
  if(state.pinsShow) mostrarPin(state.pinsShow);
}
function mostrarPin(arr){
  state.pinsShow=arr; const box=$("#pfPins"); if(!box) return; box.hidden=false;
  box.innerHTML='<div class="hintbox warn"><strong>Anote este PIN ahora.</strong> Por seguridad no se vuelve a mostrar: la plataforma solo guarda una versión cifrada.'+arr.map(x=>'<div style="margin-top:8px;font-size:15px">'+esc(x.nombre)+(x.cargo?' · '+esc(x.cargo):'')+': <strong class="mono" style="font-size:18px;letter-spacing:.1em">'+esc(x.pin)+'</strong></div>').join("")+'<div class="row" style="margin-top:10px"><button class="btn sm" id="pfPinsOk" type="button">Ya lo anoté, ocultar</button></div></div>';
  $("#pfPinsOk").onclick=()=>{ state.pinsShow=null; box.hidden=true; box.innerHTML=""; };
}

/* ---------- Archivos adjuntos en la versión del colegio (sin pagar almacenamiento) ---------- */
function comprimirImagen(file){
  return new Promise((res,rej)=>{ const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ URL.revokeObjectURL(url); let w=img.naturalWidth, hh=img.naturalHeight, max=1800, q=0.72, out="";
      const cv=document.createElement("canvas"), cx=cv.getContext("2d");
      for(let i=0;i<10;i++){ const k=Math.min(1,max/Math.max(w,hh)); cv.width=Math.round(w*k); cv.height=Math.round(hh*k); cx.fillStyle="#fff"; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(img,0,0,cv.width,cv.height); out=cv.toDataURL("image/jpeg",q); if(out.length<=650000) return res(out); if(q>0.45) q-=0.1; else max=Math.round(max*0.8); }
      rej(new Error("grande")); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("formato")); }; img.src=url; });

async function importarRespaldo(file){
  const msg={ set textContent(t){ state.rsMsg=t; const m=$("#rsMsg"); if(m) m.textContent=t; } }; msg.textContent="Leyendo archivo…";
  let data=null; try{ data=JSON.parse(await file.text()); }catch(e){ msg.textContent="El archivo no es un respaldo válido."; return; }

    } else { msg.textContent="Para importar, use la versión conectada a la base de datos."; return; }
    if(data.config && !state.configSaved) await saveConfig(Object.assign(clone(state.config),data.config));
    msg.textContent="Listo: se importaron "+data.estudiantes.length+" estudiantes y "+(data.registros||[]).length+" registros.";
  }catch(e){ msg.textContent="Se detuvo en "+n+" de "+items.length+". "+(e&&e.code==="permission-denied"?"Su cuenta no tiene permiso.":"Revise su conexión e intente de nuevo; lo ya importado se mantiene."); }
}

/* ---- Eventos por día (Hoy y Calendario) ---- */
const TLABEL = {atraso:"Atrasos", inasistencia:"Inasistencias", retiro:"Retiros", anotacion:"Anotaciones negativas", positiva:"Anotaciones positivas", dispositivo:"Dispositivos requisados", medida:"Medidas", citacion:"Citaciones"};
function eventosDia(f){
  const out=[], work=isWork(parse(f));
  R().forEach(r=>{
    if((r.tipo==="atraso"||r.tipo==="retiro"||r.tipo==="anotacion"||r.tipo==="positiva"||r.tipo==="dispositivo") && r.fecha===f) out.push({k:"reg",t:r.tipo,r,h:r.hora||"",f});
    if(r.tipo==="medida"){ const m=MMAP[r.medida]||{};
      if(m.s){ if(r.sesFecha===f) out.push({k:"ses",t:"medida",r,h:r.sesHora||"",f}); }
      else if(r.medida==="suspension"){ if(r.desde<=f && r.hasta>=f && work) out.push({k:"susp",t:"medida",r,h:"",f}); }
      else if(r.fecha===f) out.push({k:"reg",t:"medida",r,h:"",f});
    }
    if(r.tipo==="inasistencia" && r.fecha<=f && (r.hasta||r.fecha)>=f && (work||r.fecha===f)) out.push({k:"reg",t:"inasistencia",r,h:"",f});
    if(r.tipo==="citacion" && r.fecha===f) out.push({k:"cit",t:"citacion",r,h:r.hora||"",f});
    if(r.tipo==="dispositivo" && r.estado!=="devuelto" && r.retencionHasta===f) out.push({k:"dev",t:"dispositivo",r,h:"",f});
  });
  return out.sort((a,b)=>(a.h||"99").localeCompare(b.h||"99") || a.r.nombre.localeCompare(b.r.nombre,"es"));
}

function renderCal(){
  const host=$("#view-cal");
  if(!state.cal){ const d=new Date(); state.cal={y:d.getFullYear(), m:d.getMonth(), sel:today()}; }
  if(!state.loaded){ host.innerHTML='<div class="calm">Cargando…</div>'; return; }
  const {y,m,sel}=state.cal, t=today();
  const first=new Date(y,m,1), lead=(first.getDay()+6)%7, dim=new Date(y,m+1,0).getDate();
  let cells='';
  for(let i=0;i<lead;i++) cells+='<span class="day off" aria-hidden="true"></span>';
  for(let d=1; d<=dim; d++){
    const f=fmt(new Date(y,m,d)), evs=eventosDia(f), wd=new Date(y,m,d).getDay();
    const by={}; evs.forEach(e=>{ by[e.t]=(by[e.t]||0)+1; });
    const dots=Object.keys(TIPOS).filter(k=>by[k]).map(k=>'<span class="cdot t-'+k+'" title="'+by[k]+' '+esc(TLABEL[k].toLowerCase())+'">'+by[k]+'</span>').join("");
    const cls=["day"]; if(wd===0||wd===6||FERIADOS.has(f)) cls.push("we"); if(f===t) cls.push("today"); if(f<t) cls.push("past");
    cells+='<button type="button" class="'+cls.join(" ")+'" data-day="'+f+'" aria-pressed="'+(f===sel)+'" aria-label="'+esc(fechaLarga(f))+', '+evs.length+' eventos"><span class="dn">'+d+'</span><span class="cdots">'+dots+'</span></button>';
  }
  const evs=eventosDia(sel);
  const fl=fechaLarga(sel);
  host.innerHTML='<div class="cal-head"><div class="row" style="align-items:center"><button class="btn sm" type="button" id="calPrev" aria-label="Mes anterior">‹</button><h2 style="min-width:170px;text-align:center">'+MESES_L[m]+' '+y+'</h2><button class="btn sm" type="button" id="calNext" aria-label="Mes siguiente">›</button><button class="btn sm ghost" type="button" id="calHoy">Hoy</button></div>'+legendHTML()+'</div>'+
    '<div class="cal">'+["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"].map(w=>'<span class="wd">'+w+'</span>').join("")+cells+'</div>'+
    '<div class="section-h"><div><div class="eyebrow">'+(sel===t?"Hoy":sel<t?"Día pasado":"Programado")+'</div><h2>'+esc(fl.charAt(0).toUpperCase()+fl.slice(1))+'</h2></div><span class="n">'+evs.length+'</span></div>'+
    (evs.length ? '<div class="evs">'+evs.map(e=>eventRow(e,false)).join("")+'</div>' : '<div class="calm">'+(sel<t?'No hubo registros este día.':'No hay nada programado para este día.')+'</div>');
  const go=(dy,dm)=>{ let nm=m+dm, ny=y; if(nm<0){nm=11;ny--;} if(nm>11){nm=0;ny++;} state.cal={y:ny,m:nm,sel:fmt(new Date(ny,nm,1))}; renderCal(); };
  $("#calPrev").onclick=()=>go(0,-1); $("#calNext").onclick=()=>go(0,1);
  $("#calHoy").onclick=()=>{ const d=new Date(); state.cal={y:d.getFullYear(),m:d.getMonth(),sel:today()}; renderCal(); };
  host.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{ state.cal.sel=b.dataset.day; renderCal(); });
  bindView(host,[]);
}

function sesionesHTML(ses){
  const t=today(), g=new Map();
  ses.slice().sort((a,b)=>(a.sesFecha+a.sesHora).localeCompare(b.sesFecha+b.sesHora)).forEach(r=>{ const k=r.sesFecha+"|"+(r.sesHora||""); if(!g.has(k)) g.set(k,[]); g.get(k).push(r); });
  return [...g.entries()].map(([k,list])=>{ const [f,hh]=k.split("|"); const late=f<t;
    return '<div class="sess"><div class="sess-h'+(late?" late":"")+'"><span class="when">'+esc(fechaLarga(f))+(hh?' · '+esc(hh):'')+'</span><span>'+(late?'Falta registrar asistencia · ':f===t?'Hoy · ':'')+list.length+' estudiante'+(list.length>1?'s':'')+'</span></div>'+
      list.map(r=>'<div class="roll"><span>'+estLink(r.estId,r.nombre)+' <span class="muted">· '+esc(cursoLabel(r.nivel,r.letra))+'</span><span class="sub">'+esc(MMAP[r.medida].l)+' · '+esc(motivoTexto(r)||"—")+'</span></span><span class="acts"><button class="btn sm" data-ses="'+esc(r.id)+'" data-v="cumplida">Asistió</button><button class="btn sm" data-ses="'+esc(r.id)+'" data-v="no_asistio">No se presentó</button><button class="btn sm" data-ses="'+esc(r.id)+'" data-v="justifico">Justificó</button></span></div>').join("")+'</div>'; }).join("");
}

async function alertAction(a, act){
  if(!a) return;
  if(act==="ok"){ if(!(await needAutor())) return; if(await ackAviso(a.est.id,a.k)) toast("Aviso marcado como hecho"); }
  if(act==="correo") correoModal(a);
  if(act==="programar") programarModal(a);
  if(act==="medida"){ prefill={estId:a.est.id, tipo:"medida", motivoId:a.reg.id}; state.regTipo="medida"; setTab("registrar"); }
  if(act==="sinmedida"){ if(!(await needAutor())) return; const r=clone(a.reg); r.sinMedida={fecha:today(),por:ME||""}; if(await saveReg(r)) toast("Registrado: sin medida adicional"); }
}
async function marcarSesion(id, v){
  const r=R().find(x=>x.id===id); if(!r) return; if(!(await needAutor())) return;
  const n=clone(r); n.estado=v; n.asistencia={fecha:today(), por:ME||""};
  if(v==="justifico"){ n.estado="programada"; n.reprogramadaDe=(n.reprogramadaDe||[]).concat([n.sesFecha]); n.sesFecha=nextBusiness(n.sesFecha<today()?today():n.sesFecha); }
  const anId = v==="justifico" ? r.anotInasistId : null; if(anId) delete n.anotInasistId;
  if(!(await saveReg(n))) return;
  if(anId){ const an=R().find(x=>x.id===anId); if(an && !an.anulada){ const a2=clone(an); a2.anulada={motivo:"Justificó la inasistencia (certificado médico)",fecha:today(),por:ME||""}; await saveReg(a2); } toast("Anotación por inasistencia anulada. Medida reprogramada para el "+fechaCorta(n.sesFecha)); return; }
  if(v==="no_asistio" && !r.anotInasistId){
    const e=EST.get(r.estId)||{}; const ci=cicloDe(e.nivel);
    const an=Object.assign(baseReg("anotacion",r.estId),{fecha:today(),ambito:ci==="sec"?"ped":"",conducta:"Inasistencia a medida disciplinaria o formativa sin justificación",gravedad:"leve",auto:true,medidaId:r.id});
    if(await saveReg(an)){ const n2=clone(n); n2.anotInasistId=an.id; await saveReg(n2); toast("Anotación negativa registrada. Queda en Pendientes para ver si justifica"); }
  } else toast(v==="justifico"?"Reprogramada para el "+fechaCorta(n.sesFecha):"Asistencia registrada");
}
async function marcarCitacion(id,v){
  const r=R().find(x=>x.id===id); if(!r) return; if(!(await needAutor())) return;
  const n=clone(r); n.estado=v; n.asistencia={fecha:today(),por:ME||""};
  if(await saveReg(n)) toast(v==="no_asistio"?"Registrado. Según el RICE se puede emitir amonestación escrita al apoderado.":"Asistencia registrada");
}

    (a.plan==="cel"?'':'<div class="grid g2"><label class="f">Fecha<input type="date" id="pgMF" value="'+nextWeekday(t,wd)+'"></label><label class="f">Hora<input type="time" id="pgMH" value="'+esc(C.horaMedida||"14:30")+'"></label></div>')+'</fieldset>'+

  if(a.plan==="cel") $("#pgM").checked=true;
  $("#pgNo").onclick=closeModal;
  $("#pgSi").onclick=async()=>{
    if(!(await needAutor())) return;
    const motivo = a.plan==="atr" ? "Más de 5 atrasos ("+periodLabel(curPeriod())+")" : a.plan==="an" ? "Anotaciones acumuladas ("+periodLabel(curPeriod())+")" : "3ª infracción con dispositivos";
    let ok=true;
    if($("#pgC").checked){ const c=Object.assign(baseReg("citacion",e.id),{fecha:$("#pgCF").value||nextBusiness(t),hora:$("#pgCH").value||"",con:$("#pgCon").value,motivo:$("#pgMot").value,estado:"pendiente",aviso:a.k}); ok=ok&&await saveReg(c); }
    if($("#pgM").checked){
      const m = a.plan==="cel" ? Object.assign(baseReg("medida",e.id),{fecha:t,medida:"carta_comp",cartaEstado:"vigente",motivo,gravedadRef:"extrema",fechaCom:t,aviso:a.k})
        : Object.assign(baseReg("medida",e.id),{fecha:t,medida:"trabajo",sesFecha:$("#pgMF").value,sesHora:$("#pgMH").value,estado:"programada",motivo,gravedadRef:"grave",fechaCom:t,aviso:a.k});
      ok=ok&&await saveReg(m);
    }
    if(ok && await ackAviso(e.id,a.k,"Programado")){ closeModal(); toast("Citación y medida programadas"); }
  };
}

function renderResult(){ const h=$("#resHost"); if(!h) return; const r=state.lastResult; h.innerHTML = r ? '<div class="result '+(r.cls||"")+'" role="status">'+r.html+'</div>' : ""; }
function renderPicker(){
  const host=$("#pkHost"); if(!host) return;
  if(PK.sel){
    const s=PK.sel, isNew=!s.id;
    let meta="";
    if(!isNew){ const c=cuenta(s.id), carta=cartaDe(s.id); meta='<div class="meta"><span>'+esc(cursoLabel(s.nivel,s.letra))+'</span><span>'+c.atr+' atrasos</span><span>'+c.an+' anotaciones</span><span>'+c.cel+' dispositivos en el año</span>'+(carta?'<span class="chip bad">'+esc(carta)+'</span>':'')+'</div>'; }
    host.innerHTML='<div class="selcard"><div style="min-width:0"><div class="eyebrow">'+(isNew?"Estudiante nuevo":"Estudiante")+'</div><div class="nm">'+esc(s.nombre)+'</div>'+meta+'</div><button class="btn sm" id="pkChange" type="button">Cambiar</button></div>'+
      (isNew?'<div class="grid g2" style="margin-top:10px"><label class="f">Curso<select id="pkNivel"><option value="">Elegir…</option>'+NIVELES.filter(n=>n.ci!=="mat").map(n=>'<option value="'+n.c+'"'+(s.nivel===n.c?" selected":"")+'>'+esc(n.l)+'</option>').join("")+'</select></label><label class="f">Letra<select id="pkLetra"><option value="">—</option>'+LETRAS.map(l=>'<option'+(s.letra===l?" selected":"")+'>'+l+'</option>').join("")+'</select></label></div>':'');
    $("#pkChange").onclick=()=>{ PK.sel=null; PK.q=""; renderPicker(); renderFields(); setTimeout(()=>$("#pkQ").focus(),20); };
    if(isNew){ $("#pkNivel").onchange=ev=>{ PK.sel.nivel=ev.target.value; renderFields(); }; $("#pkLetra").onchange=ev=>{ PK.sel.letra=ev.target.value; }; }
    return;
  }
  host.innerHTML='<label class="f picker">Estudiante<input type="search" id="pkQ" autocomplete="off" placeholder="Escriba nombre o apellido" value="'+esc(PK.q)+'" role="combobox" aria-expanded="false" aria-controls="pkList"><ul class="sugs" id="pkList" role="listbox" hidden></ul></label>';
  const q=$("#pkQ"), list=$("#pkList");
  const draw=()=>{
    const v=nkey(q.value); PK.q=q.value;
    if(v.length<2){ list.hidden=true; q.setAttribute("aria-expanded","false"); return; }
    const words=v.split(" ");

function adjLink(a){

function justifPanel(r){
  const jt=state.drawer.jt||"cert";

  return '<div class="panel" id="jPanel"><h3>Justificación de la '+(ina?'inasistencia':'anotación')+'</h3>'+
    '<div class="seg" role="group" aria-label="Tipo de justificación" style="margin-bottom:12px"><button type="button" data-jt="cert" aria-pressed="'+(jt==="cert")+'">Presentó certificado médico</button><button type="button" data-jt="otra" aria-pressed="'+(jt==="otra")+'">'+(ina?'Correo del apoderado u otra':'Otra justificación')+'</button></div>'+

    '<label class="f"><span id="jFileL">'+(jt==="cert"?"Certificado":"Respaldo (opcional)")+'</span><input type="file" id="jFile" accept="application/pdf,image/jpeg,image/png,image/webp,.pdf,.jpg,.jpeg,.png"><span class="hint">PDF, JPG o PNG, hasta 20 MB. Puede ser una foto.</span></label></div>'+
    '<label class="f" id="jMotW" style="margin-top:12px"'+(jt==="otra"?'':' hidden')+'>Cuál fue la justificación<input type="text" id="jMot" placeholder="Ej.: aviso del apoderado por correo"></label>'+

}
const tipoArchivo = f => f.type || ({pdf:"application/pdf",jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",webp:"image/webp"})[(f.name.split(".").pop()||"").toLowerCase()] || "";
function bindJustif(r){
  const setJt=jt=>{ state.drawer.jt=jt; $$("#jPanel [data-jt]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.jt===jt))); $("#jMotW").hidden=jt!=="otra"; $("#jFileL").textContent=jt==="cert"?"Certificado":"Respaldo (opcional)"; };
  $$("#jPanel [data-jt]").forEach(b=>b.onclick=()=>setJt(b.dataset.jt));
  $("#jNo").onclick=()=>{ state.drawer.justify=false; renderDrawer(); };
  $("#jSi").onclick=async()=>{
    const err=$("#jErr"), btn=$("#jSi"); err.textContent="";
    const jt=state.drawer.jt||"cert", file=$("#jFile").files[0], fecha=$("#jF").value||today(), mot=$("#jMot").value.trim();
    if(jt==="cert" && !file){ err.textContent="Adjunte el certificado."; return; }
    if(file && file.size>20*1024*1024){ err.textContent="El archivo pesa más de 20 MB."; return; }
    const tipo=file?tipoArchivo(file):"";
    if(file && !/^(application\/pdf|image\/(jpeg|png|webp))$/.test(tipo)){ err.textContent="Formato no aceptado. Use PDF, JPG o PNG."; return; }
    if(!(await needAutor())) return;
    let adj=null;
    if(file){
      if(state.demo) adj={nombre:file.name, demo:true};
      else if(state.mode==="fb"){
        btn.disabled=true; btn.textContent="Guardando archivo…";
        try{
          let du;
          if(tipo.startsWith("image/")) du=await comprimirImagen(file);

          adj={adjId:aid, nombre:file.name, tipo};
        }catch(e){ btn.disabled=false; btn.textContent="Guardar justificación"; err.textContent=e&&e.message==="pdfgrande"?"El PDF pesa más de 700 KB. Envíe una foto del certificado (se comprime sola) o un PDF más liviano.":e&&e.message==="grande"?"La imagen es demasiado grande.":"No se pudo guardar el archivo. Intente de nuevo."; return; }
      }
      else if(!IN_CLAUDE) adj={nombre:file.name, url:URL.createObjectURL(file)};

      else {

        catch(e){ btn.disabled=false; btn.textContent="Guardar justificación"; const c=e&&e.code;
          err.textContent = c==="unsupported_type"?"Formato no aceptado. Use PDF, JPG o PNG.":c==="too_large"||c==="payload_too_large"?"El archivo es demasiado grande.":c==="quota_exceeded"?"Se llenó el espacio para archivos de la página.":c==="not_granted"?"Su acceso no permite adjuntar archivos.":"No se pudo subir el archivo. Intente de nuevo."; return; }
      }
    }
    const motivo = jt==="cert" ? "Presentó certificado médico" : "Justificó"+(mot?": "+mot:"");
    if(r.tipo==="inasistencia"){ const n=clone(r); n.justificacion={tipo:jt==="cert"?"cert":"correo", motivo, fecha, por:ME||"", adjunto:adj||(r.justificacion&&r.justificacion.adjunto)||null};

      state.drawer.justify=false; renderDrawer(); toast("Justificación guardada"); return; }
    const n=clone(r); n.anulada={tipo:jt, motivo, fecha, por:ME||"", adjunto:adj};
    if(!(await saveReg(n))){ btn.disabled=false; btn.textContent="Guardar justificación"; return; }
    let msg="Justificación guardada: la anotación ya no cuenta";
    if(r.medidaId){ const m=R().find(x=>x.id===r.medidaId);
      if(m && m.estado==="no_asistio"){ const m2=clone(m); m2.estado="programada"; m2.reprogramadaDe=(m2.reprogramadaDe||[]).concat([m2.sesFecha]); m2.sesFecha=nextBusiness(today()); delete m2.anotInasistId; m2.justificacion={motivo, fecha, por:ME||"", adjunto:adj};
        if(await saveReg(m2)) msg+=". Medida reprogramada para el "+fechaCorta(m2.sesFecha); } }
    state.drawer.justify=false; renderDrawer(); toast(msg);
  };
}

  const cumpl={c:ses.filter(r=>r.estado==="cumplida").length,n:ses.filter(r=>r.estado==="no_asistio").length,p:ses.filter(r=>(r.estado||"programada")==="programada").length};
  host.innerHTML='<div class="section-h"><div><div class="eyebrow">Estadísticas</div><h2>Vida Escolar en cifras</h2></div><label class="f">Periodo<select id="stP">'+opts.map(([k,l])=>'<option value="'+k+'"'+(k===sel?" selected":"")+'>'+esc(l)+'</option>').join("")+'</select></label></div>'+
    '<div class="kpis">'+kpiStat(atr.length,"Atrasos sin justificar")+kpiStat(an.length,"Anotaciones negativas")+kpiStat(L.filter(r=>r.tipo==="positiva").length,"Anotaciones positivas")+kpiStat(dis.length,"Dispositivos requisados")+kpiStat(med.length,"Medidas aplicadas")+kpiStat(ina.reduce((a,r)=>a+(r.dias||1),0),"Días de inasistencia")+kpiStat(ret.length,"Retiros")+'</div>'+
    '<div class="charts">'+
    '<div class="card wide"><h3>Atrasos por mes</h3><p class="sub">Sin justificar · marzo a diciembre</p><div class="months">'+mc.map(v=>'<div class="mcol"><div class="top">'+(v||"")+'</div><div class="b" style="height:'+(v/mmax*100*0.85)+'%"></div></div>').join("")+'</div><div class="mlabels">'+months.map(m=>'<span>'+MESES[m]+'</span>').join("")+'</div></div>'+
    '<div class="card"><h3>Atrasos por curso</h3><p class="sub">Cursos con más atrasos</p>'+hbars(porCurso.slice(0,12))+'</div>'+
    '<div class="card"><h3>Estudiantes con más atrasos</h3><p class="sub">Los 10 primeros</p>'+hbars(topEst.map(i=>Object.assign(i,{c:i.v>=state.config.atrGrave?"b":i.v>=state.config.atrAviso?"w":""})))+'</div>'+
    '<div class="card"><h3>Anotaciones por gravedad</h3><p class="sub">Según tipificación del RICE</p>'+hbars([{l:"Leves",v:g.leve},{l:"Graves",v:g.grave,c:"w"},{l:"Extremadamente graves",v:g.extrema,c:"b"}])+'</div>'+
    '<div class="card"><h3>Motivos más frecuentes</h3><p class="sub">Anotaciones del periodo</p>'+hbars(conds)+'</div>'+
    '<div class="card"><h3>Estudiantes con más días de inasistencia</h3><p class="sub">Los 10 primeros · '+ina.filter(r=>!r.justificacion).length+' inasistencias sin justificar</p>'+hbars((()=>{ const m=new Map(); ina.forEach(r=>{ const k=r.nombre+" · "+cursoLabel(r.nivel,r.letra); m.set(k,(m.get(k)||0)+(r.dias||1)); }); return [...m.entries()].map(([l,v])=>({l,v})).sort((a,b)=>b.v-a.v).slice(0,10); })())+'</div>'+
    '<div class="card"><h3>Retiros por motivo</h3><p class="sub">Salidas anticipadas del periodo</p>'+hbars(tally(ret,r=>r.motivo))+'</div>'+
    '<div class="card"><h3>Cumplimiento de medidas fuera de jornada</h3><p class="sub">Trabajo especial, reflexión y servicios</p>'+hbars([{l:"Cumplidas",v:cumpl.c},{l:"No se presentó",v:cumpl.n,c:"b"},{l:"Programadas",v:cumpl.p,c:"w"}])+'</div>'+
    '</div>';
  $("#stP").onchange=ev=>{ state.statsP=ev.target.value; renderStats(); };
}
const kpiStat=(v,l)=>'<div class="kpi"><div class="v">'+esc(v)+'</div><div class="l">'+esc(l)+'</div></div>';

/* =================== Ajustes =================== */
function renderAjustes(){
  const C=state.config, host=$("#view-ajustes");
  const num=(id,v,l,ref)=>'<div class="cfg-row"><label for="'+id+'">'+esc(l)+(ref?'<span class="ref">'+esc(ref)+'</span>':'')+'</label><input type="number" id="'+id+'" min="1" max="30" value="'+esc(v)+'"></div>';
  host.innerHTML='<div class="panel"><h2>Reglas del RICE</h2><p class="lead">Vienen cargadas según el RICE 2025. Se comparten con todo el equipo.</p>'+
    '<div class="grid g2"><label class="f">Contar atrasos y anotaciones por<select id="cfP"><option value="semestre"'+(C.periodo==="semestre"?" selected":"")+'>Semestre</option><option value="anio"'+(C.periodo==="anio"?" selected":"")+'>Año escolar</option></select></label><label class="f">Inicio del 2° semestre <span class="hint">Mes-día</span><input type="text" id="cfS2" value="'+esc(C.s2Inicio)+'" placeholder="08-01"></label></div>'+
    num("cfAA",C.atrAviso,"Atraso que activa el correo al apoderado y profesor/a jefe","RICE pág. 39: al tercer atraso")+
    num("cfAG",C.atrGrave,"Atraso que se considera falta grave","RICE pág. 39: posterior al quinto atraso")+
    num("cfNA",C.anAviso,"Anotaciones para notificar al apoderado","RICE pág. 114: 3 anotaciones")+
    num("cfNC",C.anCita,"Anotaciones para citar con CPE y trabajo especial","RICE pág. 114: 5 anotaciones")+
    num("cfRet",C.retencion,"Días hábiles de retención en la 2ª infracción con dispositivo","Protocolo de dispositivos pág. 213")+
    '<div class="grid g2" style="margin-top:12px"><label class="f">Día habitual de medidas fuera de jornada<select id="cfDia">'+[3,6,1,2,4,5].map(d=>'<option value="'+d+'"'+(+C.diaMedida===d?" selected":"")+'>'+DIAS[d]+'</option>').join("")+'</select></label><label class="f">Hora habitual<input type="time" id="cfHora" value="'+esc(C.horaMedida)+'"></label></div>'+
    '<label class="check" style="margin-top:12px"><input type="checkbox" id="cfJ"'+(C.contarJustificados?" checked":"")+'> Contar también los atrasos justificados</label></div>'+
    '<div class="panel"><h2>Inspectores por nivel</h2><p class="lead">Aparecen en la ficha de cada estudiante (RICE pág. 256–257).</p><div class="grid g2">'+INSP_GRUPOS.map(g=>'<label class="f">'+esc(g.l)+'<input type="text" id="cfI_'+g.k+'" value="'+esc((C.inspectores||{})[g.k]||"")+'"></label>').join("")+'</div></div>'+
    '<div class="panel"><h2>Calendario y seguridad</h2><div class="grid g2"><label class="f">Feriados <span class="hint">Una fecha por línea (AAAA-MM-DD). No cuentan como días hábiles.</span><textarea id="cfFer" rows="7">'+esc((C.feriados||[]).join("\n"))+'</textarea></label><label class="f">Clave de administración <span class="hint">Para eliminar registros y entrar si se olvida un PIN. Provisoria: 0000</span><input type="password" id="cfClave" autocomplete="new-password" placeholder="Nueva clave (vacío para mantener)"></label></div>'+
    '<div class="form-actions" style="margin-top:16px"><span class="err" id="cfMsg"></span>'+(state.demo||state.mode==="fb"?'':'<button class="btn" id="cfDemo" type="button">Ver demostración</button>')+'<button class="btn primary" id="cfSave" type="button">Guardar ajustes</button></div></div>'+
    '<div class="panel" id="perfilesPanel" hidden><h2>Enlace del equipo</h2><p class="lead">Quien tenga este enlace puede abrir Vida Escolar. Compártalo solo con Inspectoría y Vida Escolar.</p><div class="linkbox"><code id="eqLink"></code><button class="btn sm" id="eqCopy" type="button">Copiar</button></div>'+
      '<h2 style="margin-top:22px">Perfiles</h2><p class="lead" id="pfIntro"></p><div id="pfPins" hidden></div><ul class="eqlist" id="pfList"></ul>'+
      '<form id="pfAdd" class="grid g4" style="margin-top:16px;align-items:end"><label class="f">Nombre<input type="text" id="pfNombre" required placeholder="Ej.: Roxana Barría"></label><label class="f">Cargo<input type="text" id="pfCargo" placeholder="Ej.: Inspectora 6° a 8°"></label><label class="f">Perfil<select id="pfRol">'+Object.entries(ROLES_PERFIL).map(([k,v])=>'<option value="'+k+'">'+esc(v.l)+'</option>').join("")+'</select></label><button class="btn primary" type="submit">Crear perfil</button></form><p class="ref" style="margin:8px 0 0">El PIN se genera al azar y se muestra una sola vez. Para elegir uno propio, use «Cambiar PIN».</p></div>'+
    '<div class="panel"><h2>Respaldo</h2><p class="lead">Descargue una copia de todos los estudiantes y registros, o cargue un respaldo (por ejemplo, para pasar los datos a la versión del colegio).</p>'+
      '<div class="row"><button class="btn" id="rsExp" type="button">Descargar respaldo</button>'+(state.mode==="fb"||state.mode==="db"?'<label class="btn" for="rsFile" style="cursor:pointer">Importar respaldo<input type="file" id="rsFile" accept=".json,application/json" hidden></label>':'')+'</div><p class="ref" id="rsMsg" role="status" style="margin:10px 0 0"></p></div>';
  $("#cfSave").onclick=async()=>{
    const n=v=>Math.max(1,Math.round(+v||1));
    const cfg=Object.assign(clone(C),{periodo:$("#cfP").value,s2Inicio:/^\d\d-\d\d$/.test($("#cfS2").value.trim())?$("#cfS2").value.trim():"08-01",atrAviso:n($("#cfAA").value),atrGrave:n($("#cfAG").value),anAviso:n($("#cfNA").value),anCita:n($("#cfNC").value),retencion:n($("#cfRet").value),diaMedida:+$("#cfDia").value,horaMedida:$("#cfHora").value||"14:30",contarJustificados:$("#cfJ").checked,
      inspectores:Object.fromEntries(INSP_GRUPOS.map(g=>[g.k,$("#cfI_"+g.k).value.trim()])), feriados:$("#cfFer").value.split(/\s+/).filter(x=>/^\d{4}-\d\d-\d\d$/.test(x))});
    const k=$("#cfClave").value.trim(); if(k){ cfg.claveHash=await hashClave(k); delete cfg.claveEliminar; }
    const ok=await saveConfig(cfg); $("#cfMsg").textContent=ok?"":"No se pudieron guardar los ajustes."; if(ok) toast("Ajustes guardados");
  };
  if($("#cfDemo")) $("#cfDemo").onclick=()=>{ startDemo(false); setTab("hoy"); };
  $("#rsExp").onclick=exportarRespaldo;
  if($("#rsFile")) $("#rsFile").onchange=ev=>{ const f=ev.target.files[0]; if(f) importarRespaldo(f); ev.target.value=""; };
  renderPerfiles();
  $("#rsMsg").textContent=state.rsMsg||"";
}

/* =================== Demostración (datos inventados, no se guardan) =================== */
function startDemo(auto){
  if(auto===undefined) auto=true;
  const t=today(), ests=[], regs=[];
  const back=n=>{ let d=t; let k=n; while(k>0){ d=addDays(d,-1); if(isWork(parse(d))) k--; } return d; };
  const mk=(nombre,nivel,letra,extra)=>{ const e=Object.assign({id:uid("e"),nombre,nivel,letra,avisos:{},apoderado:"",correoApoderado:"",profesorJefe:"",correoPJ:""},extra||{}); ests.push(e); return e; };
  const R0=(e,o)=>{ const r=Object.assign({id:uid("r"),estId:e.id,nombre:e.nombre,nivel:e.nivel,letra:e.letra,por:"Inspectora de nivel (ejemplo)",ts:new Date().toISOString()},o); regs.push(r); return r; };
  const atr=(e,n,h)=>R0(e,{tipo:"atraso",fecha:back(n),hora:h,jornada:h>="12:00"?"tarde":"mañana",min:Math.max(0,toMin(h)-toMin(cicloDe(e.nivel)==="sec"?(h>="12:00"?"14:10":"08:00"):(h>="12:00"?"14:00":"08:10"))),justificado:false});
  const a=mk("Valentina Ortega (ejemplo)","8B","A",{apoderado:"Carolina Muñoz",correoApoderado:"apoderado.ejemplo@correo.cl",profesorJefe:"Prof. jefe 8° A"});
  [14,10,6,3].forEach((n,i)=>atr(a,n,["08:07","08:22","08:12","08:35"][i]));
  const b=mk("Benjamín Soto (ejemplo)","2M","B");
  [30,24,18,12,8,4].forEach((n,i)=>atr(b,n,["08:05","08:18","08:09","08:26","08:40","08:11"][i]));
  b.avisos["atrA_"+curPeriod()]={fecha:back(11),por:"Inspectora de nivel (ejemplo)",nota:"Correo enviado"};
  const c=mk("Agustina Pérez (ejemplo)","1M","A");
  R0(c,{tipo:"anotacion",fecha:back(20),ambito:"ped",conducta:"Interrumpir la clase o distraer (ruidos, comentarios, levantarse sin permiso)",gravedad:"leve"});
  R0(c,{tipo:"anotacion",fecha:back(9),ambito:"auto",conducta:"Permanecer en zonas no permitidas (estacionamiento, sala en recreo)",gravedad:"leve"});
  R0(c,{tipo:"anotacion",fecha:back(1),ambito:"conv",conducta:"Burlas, insultos o humillación a un compañero/a",gravedad:"grave"});
  const d=mk("Matías Herrera (ejemplo)","7B","C");
  R0(d,{tipo:"dispositivo",fecha:back(25),hora:"09:30",dispositivo:"Celular",lugar:"Sala de clases",seNego:false,infraccion:1,estado:"devuelto",retencionHasta:"",devolucion:{a:"Apoderado (ejemplo)",fecha:back(24),firma:true}});
  const cel2=R0(d,{tipo:"dispositivo",fecha:back(2),hora:"11:50",dispositivo:"Celular",lugar:"Patio / recreo",seNego:false,infraccion:2,estado:"custodia",retencionHasta:addBusinessDays(back(2),5)});
  R0(d,{tipo:"medida",fecha:back(2),medida:"trabajo",sesFecha:nextWeekday(back(2),3)<t?nextWeekday(t,3):nextWeekday(back(2),3),sesHora:"14:30",estado:"programada",motivoId:cel2.id,fechaCom:back(2)});
  R0(d,{tipo:"citacion",fecha:t,hora:"12:00",con:"CPE (Inspector/a General)",motivo:"Devolución de dispositivo",estado:"pendiente",motivoId:cel2.id});
  const f=mk("Isidora Fuentes (ejemplo)","6B","A");
  const anF=R0(f,{tipo:"anotacion",fecha:back(5),ambito:"medio",conducta:"Rayados o graffiti en paredes, puertas o mobiliario",gravedad:"grave"});
  R0(f,{tipo:"medida",fecha:back(4),medida:"serv_com",sesFecha:nextWeekday(back(4),3)<t?nextWeekday(t,3):nextWeekday(back(4),3),sesHora:"14:30",estado:"programada",motivoId:anF.id,fechaCom:back(4),obs:"Limpieza de la puerta con apoyo del auxiliar."});
  const g=mk("Tomás Riquelme (ejemplo)","3M","A");
  const anG=R0(g,{tipo:"anotacion",fecha:back(6),ambito:"auto",conducta:"Consumo o porte de tabaco o cigarrillo electrónico",gravedad:"grave"});
  R0(g,{tipo:"medida",fecha:back(5),medida:"suspension",motivoId:anG.id,desde:back(1),dias:3,hasta:addBusinessDays(back(1),2),fechaCom:back(5)});
  [9,3].forEach((n,i)=>atr(g,n,["08:14","14:22"][i]));
  const h=mk("Florencia Vidal (ejemplo)","4B","B");
  [7,2].forEach(n=>atr(h,n,"08:20"));
  const k=mk("Lucas Navarro (ejemplo)","4M","A");
  atr(k,0,"08:16");
  const m=mk("Antonia Castro (ejemplo)","5B","A");
  R0(m,{tipo:"anotacion",fecha:back(3),ambito:"",conducta:"No traer el material de trabajo solicitado",gravedad:"leve"});
  const n=mk("Joaquín Morales (ejemplo)","8B","B");
  R0(n,{tipo:"medida",fecha:back(40),medida:"carta_comp",cartaEstado:"vigente",motivo:"Reiteración de faltas leves y una falta grave",fechaCom:back(40)});
  atr(n,0,"08:09");
  state.demoData={estudiantes:ests,registros:regs}; state.demo=true; state.demoAuto=auto; closeDrawer(); renderAll();
}
$("#exitDemo").onclick=()=>{ state.demo=false; state.demoData=null; try{ localStorage.setItem("ve-demo-off","1"); }catch(e){} closeDrawer(); PK={sel:null,q:"",act:0}; renderAll(); if(state.tab==="registrar") renderRegistrar(); toast("Ahora ve los datos reales del equipo"); };

/* =================== Inicio =================== */
if(!IN_CLAUDE && FIREBASE_CONFIG) leerClave();
const initial=(location.hash||"").replace("#","");
setTab(TABS.includes(initial)?initial:"hoy");
initTheme();
renderHeader();
initStore();
initDownloads();
initAssets();
})();
</script>
