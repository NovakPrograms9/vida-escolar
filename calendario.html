<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}</style>
<title>Calendario de Vida Escolar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: misma familia que Registro de Vida Escolar — barra institucional azul con franja roja; mes a la izquierda, "¿dónde está cada inspector?" del día elegido a la derecha (abajo en el celular). */
:root{
  --bg:#e6f0fa; --surface:#ffffff; --surface-2:#edf3fa; --ink:#16203a; --muted:#52607a; --line:#cddbeb;
  --accent:#0f3f7a; --accent-ink:#ffffff; --accent-soft:#e1e7f3;
  --head-bg:#0f3f7a; --head-ink:#ffffff; --head-muted:#b9c9e6; --head-line:#2a5692; --brand-red:#e4152f;
  --danger:#b3261e; --danger-soft:#fbe3e0; --ok:#2c6a3d; --ok-soft:#dff0e3; --warn:#8f5a00; --warn-soft:#fbeed2;
  --scrim:rgba(10,15,20,.45); --shadow:0 10px 40px rgba(20,30,40,.18);
  --c-salida:#0b7a7e; --s-salida:#d9f1f1; --c-paes:#6a3fb5; --s-paes:#ece4f9; --c-licencia:#b4233c; --s-licencia:#fbe1e5; --c-permiso:#9a5500; --s-permiso:#fcecd4;
  --c-capacitacion:#1d5fbf; --s-capacitacion:#e1ebfa; --c-acto:#2a7442; --s-acto:#ddf1e3; --c-turno:#4d5b70; --s-turno:#e5e9ef; --c-otro:#a3367a; --s-otro:#f7e1ef;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1422; --surface:#161d2e; --surface-2:#1f2839; --ink:#e4e9f4; --muted:#98a3ba; --line:#2a3448;
  --accent:#8fb0f0; --accent-ink:#0b1630; --accent-soft:#1b2944;
  --head-bg:#0b1733; --head-ink:#eef2fb; --head-muted:#98a8cc; --head-line:#1f2e52;
  --danger:#f08c84; --danger-soft:#3b1d1a; --ok:#81cd96; --ok-soft:#16301f; --warn:#e9b658; --warn-soft:#382b12;
  --scrim:rgba(0,0,0,.6); --shadow:0 10px 40px rgba(0,0,0,.5);
  --c-salida:#6fd6d9; --s-salida:#11343a; --c-paes:#c4a6f5; --s-paes:#2b2143; --c-licencia:#f28da0; --s-licencia:#3d1a23; --c-permiso:#f0b860; --s-permiso:#3a2a10;
  --c-capacitacion:#8db8f5; --s-capacitacion:#1a2b47; --c-acto:#86d29c; --s-acto:#16321f; --c-turno:#b9c4d4; --s-turno:#262e3a; --c-otro:#f0a3d0; --s-otro:#3a1830;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0f1422; --surface:#161d2e; --surface-2:#1f2839; --ink:#e4e9f4; --muted:#98a3ba; --line:#2a3448;
  --accent:#8fb0f0; --accent-ink:#0b1630; --accent-soft:#1b2944;
  --head-bg:#0b1733; --head-ink:#eef2fb; --head-muted:#98a8cc; --head-line:#1f2e52;
  --danger:#f08c84; --danger-soft:#3b1d1a; --ok:#81cd96; --ok-soft:#16301f; --warn:#e9b658; --warn-soft:#382b12;
  --scrim:rgba(0,0,0,.6); --shadow:0 10px 40px rgba(0,0,0,.5);
  --c-salida:#6fd6d9; --s-salida:#11343a; --c-paes:#c4a6f5; --s-paes:#2b2143; --c-licencia:#f28da0; --s-licencia:#3d1a23; --c-permiso:#f0b860; --s-permiso:#3a2a10;
  --c-capacitacion:#8db8f5; --s-capacitacion:#1a2b47; --c-acto:#86d29c; --s-acto:#16321f; --c-turno:#b9c4d4; --s-turno:#262e3a; --c-otro:#f0a3d0; --s-otro:#3a1830;
  color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head-bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.wrap{max-width:1220px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
header.top{background:var(--head-bg);color:var(--head-ink);border-bottom:3px solid var(--brand-red);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo-plate{background:#fff;border-radius:10px;padding:5px 10px;display:flex;align-items:center;flex:none}
.logo-plate img{height:38px;width:auto;display:block}
@media (max-width:520px){.logo-plate img{height:28px}}
@media (max-width:640px){header.top{position:static}}
.brand-sep{width:1px;align-self:stretch;background:var(--head-line)}
.brand h1{font-size:19px}
.brand p{margin:0;font-size:13px;color:var(--head-muted)}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mode{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--head-line);color:var(--head-muted)}
.hbtn{border:1px solid var(--head-line);background:transparent;color:var(--head-ink);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.hbtn:hover{background:var(--head-line)}
.theme-seg{display:inline-flex;border:1px solid var(--head-line);border-radius:999px;padding:2px;gap:2px}
.theme-seg button{border:0;background:transparent;color:var(--head-muted);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;cursor:pointer}
.theme-seg button[aria-pressed="true"]{background:#fff;color:#0f3f7a}

main{padding-block:20px 28px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,400px);gap:20px;align-items:start}
@media (max-width:940px){.layout{grid-template-columns:1fr}}
.col{min-width:0;display:flex;flex-direction:column;gap:16px}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn.icon{width:40px;padding:0;font-size:18px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* Calendar */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.cal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cal-head h2{font-size:24px;text-transform:capitalize}
.cal-nav{display:flex;gap:6px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.fchip:hover{border-color:var(--accent)}
.fchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) repeat(2,minmax(0,.55fr));gap:4px}
.cal .wd{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding:2px 0 4px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:9px;min-height:96px;padding:6px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0;overflow:hidden}
.day:hover{border-color:var(--muted)}
.day.off{background:transparent;border:0;cursor:default;min-height:0}
.day.we{background:var(--surface-2)}
.day.fer{background:var(--warn-soft);border-color:transparent}
.day.past .dn{color:var(--muted)}
.day.today .dn{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 7px}
.day[aria-pressed="true"]{outline:2.5px solid var(--accent);outline-offset:1px}
.dn{font-weight:700;font-size:13px;align-self:flex-start;font-variant-numeric:tabular-nums}
.fer-l{font-size:10.5px;font-weight:600;color:var(--warn);line-height:1.2}
.chips{display:flex;flex-direction:column;gap:3px;min-width:0}
.ce{display:block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--ts);color:var(--tc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:17px}
.more{font-size:11px;color:var(--muted);font-weight:600}
@media (max-width:640px){
  .cal{grid-template-columns:repeat(7,minmax(0,1fr))}
  .day{min-height:58px;padding:4px}
  .chips{flex-direction:row;flex-wrap:wrap}
  .ce{font-size:0;width:9px;height:9px;padding:0;border-radius:50%;background:var(--tc)}
  .more{font-size:10px}
  .fer-l{display:none}
}
.legend{display:flex;gap:6px 12px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--tc)}

/* Type tokens */
.t-salida{--tc:var(--c-salida);--ts:var(--s-salida)} .t-paes{--tc:var(--c-paes);--ts:var(--s-paes)} .t-licencia{--tc:var(--c-licencia);--ts:var(--s-licencia)} .t-permiso{--tc:var(--c-permiso);--ts:var(--s-permiso)}
.t-capacitacion{--tc:var(--c-capacitacion);--ts:var(--s-capacitacion)} .t-acto{--tc:var(--c-acto);--ts:var(--s-acto)} .t-turno{--tc:var(--c-turno);--ts:var(--s-turno)} .t-otro{--tc:var(--c-otro);--ts:var(--s-otro)}
.tchip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--ts);color:var(--tc);white-space:nowrap}

/* Day panel */
.dp{position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);display:flex;flex-direction:column;gap:12px}
@media (max-width:940px){.dp{position:static}}
.dp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.dp-head h2{font-size:23px}
.sum{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.out{background:var(--danger-soft);color:var(--danger)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.insp{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.ir{display:grid;grid-template-columns:40px minmax(0,1fr);gap:4px 12px;padding:12px 14px;border-top:1px solid var(--line)}
.ir:first-child{border-top:0}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;background:var(--ok-soft);color:var(--ok);font-family:var(--f-display)}
.ir.fuera .av{background:var(--danger-soft);color:var(--danger)}
.ir.parcial .av{background:var(--warn-soft);color:var(--warn)}
.ir .nm{font-weight:700;line-height:1.25}
.ir .ar{font-size:12.5px;color:var(--muted)}
.ir .st{grid-column:2;display:flex;flex-direction:column;gap:6px;margin-top:4px}
.stn{font-size:13.5px;color:var(--ok);font-weight:600}
.evb{border:0;background:var(--ts);border-radius:9px;padding:8px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;font-size:13.5px;width:100%;box-shadow:inset 3px 0 0 var(--tc)}
.evb:hover{filter:brightness(.97)}
.evb .tt{font-weight:600;color:var(--ink)}
.evb .mt{font-size:12.5px;color:var(--muted)}
.evb .tl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--tc)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:13.5px;font-weight:600}
.emptybox{background:var(--surface);border:1.5px dashed var(--line);border-radius:12px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.emptybox p{margin:0;color:var(--muted);font-size:14px;max-width:46ch}

/* Agenda */
.ag-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ag-h h3{font-size:18px}
.ag{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ag button{display:grid;grid-template-columns:110px 150px minmax(0,1fr);gap:4px 14px;align-items:center;text-align:left;border:0;border-top:1px solid var(--line);background:var(--surface);padding:10px 14px;cursor:pointer;font-size:14px;width:100%}
.ag button:first-child{border-top:0}
.ag button:hover{background:var(--accent-soft)}
.ag .fd{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ag .who{display:block;font-size:12.5px;color:var(--muted)}
.ag .tx{min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){.ag button{grid-template-columns:auto minmax(0,1fr)}.ag .tx{grid-column:1 / -1}}

/* Modal */
.modal{position:fixed;inset:0;z-index:80;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.mcard{background:var(--surface);color:var(--ink);border-radius:16px;padding:22px;width:min(600px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);border-top:4px solid var(--brand-red);margin-block:auto}
.mcard h2{font-size:21px}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;min-width:0}
label.f .hint{font-weight:400;color:var(--muted);font-size:12px}
.flabel{font-size:13px;font-weight:600}
input[type=text],input[type=password],input[type=date],input[type=time],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-weight:400;min-height:42px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:480px){.g2{grid-template-columns:1fr}}
.types{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media (max-width:560px){.types{grid-template-columns:repeat(2,minmax(0,1fr))}}
.types button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 6px;font-weight:600;font-size:13px;cursor:pointer;line-height:1.25}
.types button[aria-pressed="true"]{border-color:var(--tc);background:var(--ts);color:var(--tc)}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13.5px;cursor:pointer}
.pick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.check{display:flex;gap:9px;align-items:center;font-size:14px;font-weight:500;cursor:pointer}
.check input{width:19px;height:19px;margin:0;accent-color:var(--accent)}
.mfoot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.err{color:var(--danger);font-size:13.5px;font-weight:600;margin:0}
.who-line{font-size:12.5px;color:var(--muted);margin:0}
.confirm{background:var(--danger-soft);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
.eq-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center}
@media (max-width:520px){.eq-row{grid-template-columns:1fr auto}.eq-row .ea{grid-column:1}}
.eq-list{display:flex;flex-direction:column;gap:8px}

.acc{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.linkbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface-2);border-radius:9px;padding:10px 12px}
.linkbox code{font-family:var(--f-mono);font-size:12.5px;overflow-wrap:anywhere;flex:1 1 200px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row input{flex:1 1 200px}
.gcard form{display:flex;flex-direction:column;gap:10px}
.gcard details summary{cursor:pointer;color:var(--muted);font-size:13.5px}
.gate{position:fixed;inset:0;z-index:85;background:var(--head-bg);display:flex;align-items:center;overflow-y:auto;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.gcard{background:var(--surface);color:var(--ink);border-radius:16px;padding:28px 24px;width:min(440px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);border-top:4px solid var(--brand-red)}
.gcard img{height:44px;width:auto;align-self:flex-start}
.gcard h1{font-size:22px} .gcard p{margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;font-weight:600;z-index:90;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
footer{text-align:center;font-size:12.5px;color:var(--muted);padding-block:10px 28px}
@media (prefers-reduced-motion: no-preference){.mcard{animation:pop .16s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:.6}}}
</style>

</head>
<body>
<header class="top">

const IN_CLAUDE = !!(window.claude && typeof window.claude.use==="function");
const EQUIPO_INICIAL = [{id:"sbavestrello",nombre:"Silvia Bavestrello",area:"1° a 3° Básico"},{id:"rbarria",nombre:"Roxana Barría",area:"4° y 5° Básico"},{id:"rrojas",nombre:"Rocío Rojas",area:"6° a 8° Básico"},{id:"mburgos",nombre:"Mabel Burgos",area:"I a IV Medio"},{id:"gvalle",nombre:"Guillermo Valle",area:"Inspector de patio"},{id:"xvelasquez",nombre:"Ximena Velásquez",area:"Inspectora de patio"},{id:"nnovakovic",nombre:"Nicolás Novakovic",area:"Inspector de patio"}];

/* ===== Utilidades ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [a,b,c] = s.split("-").map(Number); return new Date(a,b-1,c); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const TODAY = iso(new Date());
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const fechaLarga = s => { const d = parse(s); return d.getDate()+" de "+MESES[d.getMonth()]; };
const fechaCorta = s => { const d = parse(s); return pad(d.getDate())+"/"+pad(d.getMonth()+1); };
const lsGet = (k,d) => { try { const v = localStorage.getItem(k); return v==null ? d : v; } catch(e) { return d; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch(e) {} };

const TIPOS = [
  {k:"salida", l:"Salida pedagógica", fuera:true, ph:"Ej.: Museo Histórico de Osorno con 5° Básico A"},
  {k:"paes", l:"PAES", fuera:true, ph:"Ej.: Examinador/a en sede Universidad de Los Lagos"},
  {k:"licencia", l:"Licencia médica", fuera:true, ph:"Ej.: Licencia médica"},
  {k:"permiso", l:"Permiso", fuera:true, ph:"Ej.: Permiso administrativo"},
  {k:"capacitacion", l:"Capacitación o reunión", fuera:true, ph:"Ej.: Jornada comunal de Convivencia Escolar"},
  {k:"acto", l:"Acto o evento", fuera:false, ph:"Ej.: Acto de aniversario en el gimnasio"},
  {k:"turno", l:"Turno o reemplazo", fuera:false, ph:"Ej.: Cubre portería en el recreo largo"},
  {k:"otro", l:"Otro", fuera:false, ph:"Describa la actividad"}
];
const TIPO = Object.fromEntries(TIPOS.map(t => [t.k,t]));
const FERIADOS = {"2026-01-01":"Año Nuevo","2026-04-03":"Viernes Santo","2026-04-04":"Sábado Santo","2026-05-01":"Día del Trabajo","2026-05-21":"Glorias Navales","2026-06-21":"Pueblos Indígenas","2026-06-29":"San Pedro y San Pablo","2026-07-16":"Virgen del Carmen","2026-08-15":"Asunción de la Virgen","2026-09-18":"Independencia","2026-09-19":"Glorias del Ejército","2026-10-12":"Encuentro de Dos Mundos","2026-10-31":"Iglesias Evangélicas","2026-11-01":"Todos los Santos","2026-12-08":"Inmaculada Concepción","2026-12-25":"Navidad"};

const iniciales = n => String(n||"").trim().split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0].toUpperCase()).join("") || "?";
const primerNombre = n => String(n||"").trim().split(/\s+/)[0] || "—";

/* ===== Estado ===== */
const state = { y:new Date().getFullYear(), m:new Date().getMonth(), sel:TODAY, filtro:lsGet("cve-filtro",""), eventos:[], equipo:[], gotE:false, gotC:false, db:null, user:null, uid:null, canWrite:true };
/* Base de datos: "db" = dentro de Claude, "fb" = Firebase (GitHub Pages) */
let MODO = null, FS = null, CLAVE = null, ME = lsGet("cve-nombre","");
const PFX = () => MODO==="fb" ? "espacios/"+CLAVE+"/" : "";
const dref = p => (MODO==="fb" ? FS : state.db).doc(PFX()+p);
const cref = p => (MODO==="fb" ? FS : state.db).collection(PFX()+p);

const eventosDe = fecha => state.eventos.filter(e => e.desde <= fecha && fecha <= (e.hasta || e.desde))
  .sort((a,b) => (a.todoDia===b.todoDia ? 0 : a.todoDia ? -1 : 1) || String(a.horaIni||"").localeCompare(String(b.horaIni||"")));
const nombreInsp = id => (state.equipo.find(i => i.id===id) || {}).nombre || "Inspector/a eliminado";
const horario = e => e.todoDia ? "Todo el día" : [e.horaIni, e.horaFin].filter(Boolean).join("–") || "Horario por confirmar";
const rango = e => (!e.hasta || e.hasta===e.desde) ? fechaCorta(e.desde) : fechaCorta(e.desde)+" al "+fechaCorta(e.hasta);

/* ===== Tema ===== */
function aplicarTema(t){ const r = document.documentElement; if(t==="auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme",t);
  document.querySelectorAll("#themeSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.th===t))); }
document.querySelectorAll("#themeSeg button").forEach(b => b.onclick = () => { lsSet("cve-tema", b.dataset.th); aplicarTema(b.dataset.th); });
aplicarTema(lsGet("cve-tema","auto"));

function toast(t){ const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2600); }

/* ===== Calendario ===== */
function renderFiltros(){
  const f = $("#filtros");
  if(!state.equipo.length){ f.innerHTML = ""; return; }
  f.innerHTML = '<button class="fchip" type="button" data-f="" aria-pressed="'+(!state.filtro)+'">Todo el equipo</button>' +
    state.equipo.map(i => '<button class="fchip" type="button" data-f="'+esc(i.id)+'" aria-pressed="'+(state.filtro===i.id)+'">'+esc(i.nombre)+'</button>').join("");
  f.querySelectorAll("button").forEach(b => b.onclick = () => { state.filtro = b.dataset.f; lsSet("cve-filtro", state.filtro); renderAll(); });
}

function renderCal(){
  const {y,m} = state;
  $("#mesTitulo").textContent = MESES[m]+" "+y;
  const first = new Date(y,m,1), off = (first.getDay()+6)%7, n = new Date(y,m+1,0).getDate();
  let h = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"].map(d => '<div class="wd" role="columnheader">'+d+'</div>').join("");
  for(let i=0;i<off;i++) h += '<div class="day off" aria-hidden="true"></div>';
  for(let d=1; d<=n; d++){
    const f = y+"-"+pad(m+1)+"-"+pad(d), wd = new Date(y,m,d).getDay();
    let evs = eventosDe(f); if(state.filtro) evs = evs.filter(e => (e.inspectores||[]).includes(state.filtro));
    const cls = ["day"]; if(wd===0||wd===6) cls.push("we"); if(FERIADOS[f]) cls.push("fer"); if(f<TODAY) cls.push("past"); if(f===TODAY) cls.push("today");
    const lab = DIAS[wd]+" "+d+" de "+MESES[m]+(FERIADOS[f]?", feriado":"")+(evs.length?", "+evs.length+" actividad"+(evs.length>1?"es":""):"");
    const max = 3, chips = evs.slice(0,max).map(e => {
      const who = (e.inspectores||[]).map(id => primerNombre(nombreInsp(id))).join(", ");
      return '<span class="ce t-'+esc(e.tipo)+'" title="'+esc(TIPO[e.tipo]?.l+": "+(e.titulo||"")+" · "+who)+'">'+esc(who||TIPO[e.tipo]?.l)+'</span>'; }).join("");

async function quienLinea(){

  const nom = id => (ps[id] && ps[id].name) || nombres[id] || "alguien del equipo";
  const fmt = s => { try { const d = new Date(s); return d.getDate()+" de "+MESES[d.getMonth()]; } catch(e) { return ""; } };

function errorMsg(e){
  const c = e && e.code;
  if(c==="invalid_argument") return "No se pudo guardar: su cuenta no tiene permiso de edición en este calendario.";
  if(c==="permission-denied") return "La base de datos rechazó el cambio. Revise que las reglas de Firestore permitan la colección «espacios».";
  if(c==="resource-exhausted") return "Firebase alcanzó el límite diario gratuito. Inténtelo mañana.";
  if(c==="quota_exceeded") return "La base de datos está llena. Elimine actividades antiguas para seguir registrando.";
  if(c==="revoked") return "Se cerró el acceso a la base de datos. Recargue la página.";
  return "No se pudo guardar por un problema de conexión. Inténtelo de nuevo.";
}
async function conReintento(fn){ try { return await fn(); } catch(e) { if(e && e.code==="unavailable"){ await new Promise(r => setTimeout(r, 600+Math.random()*700)); return await fn(); } throw e; } }
async function guardar(){

  if(!f.desde){ err.textContent = "Indique la fecha."; return; }

  if(!f.todoDia && f.horaIni && f.horaFin && f.horaFin <= f.horaIni){ err.textContent = "La hora de término debe ser posterior a la de inicio."; return; }
  if(parse(f.hasta||f.desde) - parse(f.desde) > 1000*60*60*24*120){ err.textContent = "El rango es de más de 4 meses. Revise las fechas."; return; }
  if(!MODO){ err.textContent = "No hay conexión con la base de datos compartida."; return; }
  const ahora = new Date().toISOString(), yo = MODO==="fb" ? "n:"+(ME||"Sin nombre") : state.uid;
  const data = { tipo:f.tipo, titulo:f.titulo.trim(), desde:f.desde, hasta:f.hasta||f.desde, todoDia:!!f.todoDia, horaIni:f.todoDia?"":(f.horaIni||""), horaFin:f.todoDia?"":(f.horaFin||""),
    fuera:!!f.fuera, lugar:(f.lugar||"").trim(), cubre:(f.cubre||"").trim(), notas:(f.notas||"").trim(), inspectores:f.inspectores.slice(),
    creadoPor: f._id ? (f.creadoPor||null) : yo, creadoPorNombre: f._id ? (f.creadoPorNombre||"") : (MODO==="fb" ? ME : ""), creadoEn: f._id ? (f.creadoEn||ahora) : ahora,

    await conReintento(() => ref.set(data));
    const fueNuevo = !f._id; cerrarModal(); toast(fueNuevo ? "Actividad guardada" : "Cambios guardados");
    state.sel = data.desde <= state.sel && state.sel <= data.hasta ? state.sel : data.desde;
    const d = parse(state.sel); state.y = d.getFullYear(); state.m = d.getMonth(); renderAll();
  } catch(e) { if(form===f){ err.textContent = errorMsg(e); $("#fSave").disabled = !state.canWrite; } }
}
async function eliminar(){

    try { await conReintento(() => dref("cfg/equipo").set({inspectores:lista})); cerrarModal(); toast("Equipo guardado"); if(state.filtro && !lista.some(i => i.id===state.filtro)){ state.filtro=""; lsSet("cve-filtro",""); } }
    catch(e) { $("#eErr").textContent = errorMsg(e); $("#eSave").disabled = false; }
  };
}
$("#eqBtn").onclick = abrirEquipo;

/* ===== Navegación ===== */
$("#prevM").onclick = () => { state.m--; if(state.m<0){ state.m=11; state.y--; } renderAll(); };
$("#nextM").onclick = () => { state.m++; if(state.m>11){ state.m=0; state.y++; } renderAll(); };
$("#hoyBtn").onclick = () => { const d = new Date(); state.y = d.getFullYear(); state.m = d.getMonth(); state.sel = TODAY; renderAll(); };

/* ===== Acceso y base de datos ===== */
function setMode(t){ $("#modeTag").textContent = t; }
function gate(titulo, cuerpoHtml){
  const g = $("#gate"); g.hidden = false;
  g.innerHTML = '<div class="gcard"><img src="'+$("#logo").src+'" alt="Lycée Claude Gay Osorno"><h1>'+esc(titulo)+'</h1>'+cuerpoHtml+'</div>';
}
const p = t => '<p>'+esc(t)+'</p>';
function loadScript(src){ return new Promise((res,rej) => { const sc = document.createElement("script"); sc.src = src; sc.onload = res; sc.onerror = () => rej(new Error(src)); document.head.appendChild(sc); }); }
function nuevaClave(){ const a = new Uint8Array(24); crypto.getRandomValues(a); return Array.from(a, x => "abcdefghijkmnpqrstuvwxyz23456789"[x%32]).join(""); }
const enlaceCal = () => location.origin+location.pathname+"#k="+CLAVE;
function leerClave(){
  const m = /[#&]k=([a-z0-9]{24,64})/i.exec(location.hash||"");
  if(m){ CLAVE = m[1]; lsSet("cve-clave", CLAVE); try { history.replaceState(null,"",location.pathname+location.search); } catch(e) {} return; }
  if(!CLAVE) CLAVE = lsGet("cve-clave", null);
}
async function sha(t){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return Array.from(new Uint8Array(b), x => x.toString(16).padStart(2,"0")).join(""); }
const hashAcceso = v => sha("cal-ve-lcg|"+CLAVE+"|"+v);
async function copiar(txt, btn){
  try { await navigator.clipboard.writeText(txt); const t = btn.textContent; btn.textContent = "Copiado"; setTimeout(() => btn.textContent = t, 1500); }
  catch(e) { const el = btn.previousElementSibling; if(el){ const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast("Seleccione el enlace y cópielo con Ctrl+C."); }
}

/* Lectura en vivo (igual en Claude y en Firebase) */
function suscribir(){
  const lento = setTimeout(() => setMode("Sin respuesta de la base · puede estar desactualizado"), 10000);
  const listo = () => { if(state.gotE && state.gotC){ clearTimeout(lento); setMode(MODO==="fb" ? "Base del colegio"+(ME?" · "+ME:"") : "Datos compartidos"); } };
  const fallo = (e, txt) => { clearTimeout(lento); if(e && e.code==="permission-denied"){ gate("La base de datos rechazó la conexión", p("Revise que las reglas de Firestore permitan la colección «espacios» (las mismas reglas de Vida Escolar).")); } setMode(txt); renderAll(); };
  dref("cfg/equipo").onSnapshot(s => {
    const d = s.exists ? s.data() : null;
    state.equipo = (d && Array.isArray(d.inspectores)) ? d.inspectores.map(i => ({id:String(i.id), nombre:String(i.nombre||""), area:String(i.area||"")})) : [];
    if(!s.metadata.fromCache){ state.gotC = true; listo(); } else if(state.equipo.length) state.gotC = true;
    renderAll();
  }, e => { state.gotC = true; fallo(e, "Error al leer el equipo"); });
  cref("eventos").onSnapshot(s => {
    state.eventos = s.docs.map(d => Object.assign(JSON.parse(JSON.stringify(d.data())), {id:d.id})).filter(e => typeof e.desde === "string" && e.desde).map(e => { if(!TIPO[e.tipo]) e.tipo = "otro"; if(!Array.isArray(e.inspectores)) e.inspectores = []; return e; });
    if(!s.metadata.fromCache){ state.gotE = true; listo(); } else if(s.size) state.gotE = true;
    renderAll();
  }, e => { state.gotE = true; fallo(e, "Error al leer actividades"); });
}

/* --- Dentro de Claude --- */
async function iniciarClaude(){
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  state.user = user;
  if(user){
    const [admin, uid] = await Promise.all([user.canEdit(), user.id()]);
    state.uid = uid;
    if(admin === false){ setMode("Sin acceso"); gate("Acceso restringido", p("Este calendario es solo para Subdirección y Vida Escolar. Si necesita entrar, pida a Nicolás Novakovic que lo invite como editor.")); return; }
  }
  if(!db){ setMode("Sin base de datos"); gate("No se pudo abrir la base de datos", p("Inicie sesión en Claude con la cuenta invitada y vuelva a abrir el enlace.")); return; }
  state.db = db; MODO = "db"; suscribir();
}

/* --- GitHub Pages + Firebase: enlace del calendario + clave de acceso --- */
async function cargarFirebase(){
  if(FS) return true;
  const base = "https://www.gstatic.com/firebasejs/10.12.2/";
  try { await loadScript(base+"firebase-app-compat.js"); await loadScript(base+"firebase-firestore-compat.js"); }
  catch(e) { gate("Sin conexión", p("No se pudo conectar con la base de datos. Revise su conexión a internet y recargue la página.")+'<button class="btn" type="button" onclick="location.reload()">Reintentar</button>'); return false; }
  try { if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG); FS = firebase.firestore(); FS.settings({ignoreUndefinedProperties:true}); }
  catch(e) { gate("Configuración inválida", p("La configuración de Firebase no es válida. Revise el bloque FIREBASE_CONFIG al inicio del código.")); return false; }
  return true;
}
async function iniciarFirebase(){
  leerClave();
  if(!CLAVE){ setMode("Sin enlace"); gateSinEnlace(); return; }
  setMode("Conectando…");
  if(!await cargarFirebase()) return;
  let acc;
  try { acc = await FS.doc("espacios/"+CLAVE+"/cfg/acceso").get(); }
  catch(e) {
    if(e && e.code==="permission-denied") gate("La base de datos rechazó la conexión", p("Revise que las reglas de Firestore permitan la colección «espacios» (las mismas reglas de Vida Escolar)."));
    else gate("Sin conexión", p("No se pudo leer la base de datos. Revise su conexión a internet.")+'<button class="btn" type="button" onclick="location.reload()">Reintentar</button>');
    return;
  }
  if(!acc.exists){ try { localStorage.removeItem("cve-clave"); } catch(e) {} CLAVE = null; setMode("Sin enlace"); gateSinEnlace("Ese enlace no corresponde a ningún calendario. Revise que esté completo."); return; }
  const h = (acc.data()||{}).claveHash || "";
  if(h && lsGet("cve-ok","")===h && ME){ entrar(); return; }
  gateClave(h);
}
function entrar(){ $("#gate").hidden = true; $("#gate").innerHTML = ""; MODO = "fb"; suscribir(); }

let fallos = 0, bloqueo = 0;
function gateClave(h){
  setMode("Acceso");
  gate("Calendario de Vida Escolar",
    p("Acceso solo para Subdirección y Vida Escolar.")+
    '<form id="gForm" novalidate><label class="f">Su nombre<input type="text" id="gNom" autocomplete="name" maxlength="60" value="'+esc(ME)+'" placeholder="Ej.: Nicolás Novakovic"></label>'+
    '<label class="f">Clave de acceso<input type="password" id="gClave" autocomplete="current-password"></label>'+
    '<label class="check"><input type="checkbox" id="gRec" checked> Recordarme en este computador</label>'+
    '<p class="err" id="gErr" role="alert"></p><button class="btn primary" type="submit">Entrar</button></form>');
  (ME ? $("#gClave") : $("#gNom")).focus();
  $("#gForm").onsubmit = async ev => {
    ev.preventDefault(); const err = $("#gErr");
    const nom = $("#gNom").value.trim();
    if(!nom){ err.textContent = "Escriba su nombre: queda registrado en lo que anote."; return; }
    if(Date.now() < bloqueo){ err.textContent = "Demasiados intentos. Espere "+Math.ceil((bloqueo-Date.now())/1000)+" segundos."; return; }
    let ok = false; try { ok = !!h && (await hashAcceso($("#gClave").value)) === h; } catch(e) {}
    if(!ok){ fallos++; if(fallos>=5){ bloqueo = Date.now()+30000; fallos = 0; } err.textContent = "Clave incorrecta."; $("#gClave").value = ""; $("#gClave").focus(); return; }
    ME = nom; lsSet("cve-nombre", nom); if($("#gRec").checked) lsSet("cve-ok", h); else { try { localStorage.removeItem("cve-ok"); } catch(e) {} }
    entrar(); toast("Hola, "+nom);
  };
}
function gateSinEnlace(aviso){
  gate("Calendario de Vida Escolar",
    (aviso ? '<p class="err">'+esc(aviso)+'</p>' : '')+
    p("Este calendario se abre con su enlace (termina en #k=…). Ábralo en este computador o péguelo aquí.")+
    '<form id="gLink" novalidate><label class="f">Enlace del calendario<input type="text" id="gLinkIn" autocomplete="off" placeholder="https://…#k=…"></label><button class="btn primary" type="submit">Entrar</button></form>'+
    '<p class="err" id="gErr" role="alert"></p>'+
    '<details><summary>Primera vez: crear el calendario</summary>'+
      '<form id="gNew" novalidate style="margin-top:10px">'+p("Se hace una sola vez. Se crea el calendario con el equipo de inspectoría y se genera el enlace para compartir con la subdirectora.")+
      '<label class="f">Su nombre<input type="text" id="nNom" autocomplete="name" maxlength="60" value="'+esc(ME)+'"></label>'+
      '<label class="f">Clave de acceso <span class="hint">Mínimo 6 caracteres. La usarán usted y la subdirectora.</span><input type="password" id="nC1" autocomplete="new-password"></label>'+
      '<label class="f">Repita la clave<input type="password" id="nC2" autocomplete="new-password"></label>'+
      '<p class="err" id="nErr" role="alert"></p><button class="btn" type="submit">Crear calendario</button></form></details>');
  $("#gLink").onsubmit = ev => {
    ev.preventDefault();
    const m = /[#&]k=([a-z0-9]{24,64})/i.exec($("#gLinkIn").value.trim());
    if(!m){ $("#gErr").textContent = "Ese no parece el enlace del calendario. Debe terminar en #k= seguido de letras y números."; return; }
    CLAVE = m[1]; lsSet("cve-clave", CLAVE); iniciarFirebase();
  };
  $("#gNew").onsubmit = async ev => {
    ev.preventDefault(); const err = $("#nErr"), nom = $("#nNom").value.trim(), c1 = $("#nC1").value;
    if(!nom){ err.textContent = "Escriba su nombre."; return; }
    if(c1.length < 6){ err.textContent = "La clave debe tener al menos 6 caracteres."; return; }
    if(c1 !== $("#nC2").value){ err.textContent = "Las claves no coinciden."; return; }
    if(!await cargarFirebase()) return;
    CLAVE = nuevaClave();
    try {
      const h = await hashAcceso(c1);
      await FS.doc("espacios/"+CLAVE+"/cfg/acceso").set({claveHash:h, creado:new Date().toISOString()});
      await FS.doc("espacios/"+CLAVE+"/cfg/equipo").set({inspectores:EQUIPO_INICIAL});
      lsSet("cve-clave", CLAVE); lsSet("cve-ok", h); ME = nom; lsSet("cve-nombre", nom);
      gate("Calendario creado",
        p("Este es el enlace del calendario. Guárdelo y envíelo solo a la subdirectora, junto con la clave de acceso.")+
        '<div class="linkbox"><code>'+esc(enlaceCal())+'</code><button class="btn sm" type="button" id="cCopy">Copiar</button></div>'+
        '<p class="who-line">También queda en Equipo → Acceso.</p><button class="btn primary" type="button" id="cGo">Entrar al calendario</button>');
      $("#cCopy").onclick = () => copiar(enlaceCal(), $("#cCopy"));
      $("#cGo").onclick = entrar;
    } catch(e) { CLAVE = null; err.textContent = e && e.code==="permission-denied" ? "La base de datos rechazó la creación. Revise que las reglas de Firestore permitan la colección «espacios»." : "No se pudo crear el calendario. Revise su conexión e inténtelo de nuevo."; }
  };
}

async function iniciar(){
  renderLegend(); renderAll();
  if(IN_CLAUDE) return iniciarClaude();
  if(FIREBASE_CONFIG) return iniciarFirebase();
  setMode("Sin configurar");
  gate("Falta conectar la base de datos", p("Pegue la configuración de Firebase en el bloque FIREBASE_CONFIG al inicio del código (la misma que usa Vida Escolar) y vuelva a subir el archivo."));
}
window.addEventListener("hashchange", () => { if(/[#&]k=[a-z0-9]{24,64}/i.test(location.hash)) location.reload(); });
iniciar();
</script>
